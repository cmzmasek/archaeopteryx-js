# Continuous integration: lint the source and run the forester.js test suite
# on every push and pull request.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# Cancel superseded runs for the same ref (e.g. rapid pushes to a branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
