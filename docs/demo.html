<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archaeopteryx.js — Live Demo</title>

    <!-- Everything is served from this repository (GitHub Pages); there are no
         external dependencies to expire. Load order matters: sax before
         phyloxml, and forester/phyloxml/d3 before archaeopteryx. -->
    <script src="lib/d3.v7.min.js"></script>
    <script src="lib/sax.js"></script>
    <script src="lib/rgbcolor.js"></script>
    <script src="lib/canvg.js"></script>
    <script src="lib/jspdf.umd.min.js"></script>
    <script src="lib/svg2pdf.umd.min.js"></script>
    <script src="lib/phyloxml.js"></script>
    <script src="lib/forester.js"></script>
    <script src="lib/archaeopteryx.js"></script>

    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Floating card in the top-right corner, clear of the tree's own
           control panel (which sits in the top-left). */
        #toolbar {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 1000;
            width: 250px;
            padding: 9px 12px;
            background: rgba(34, 48, 60, 0.95);
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            font-size: 13px;
        }
        #toolbar .title {
            font-weight: 600;
        }
        #toolbar a {
            color: #7fc4ff;
            text-decoration: none;
        }
        #toolbar select {
            font-size: 13px;
            padding: 4px 6px;
            width: 100%;
            margin-top: 6px;
            box-sizing: border-box;
        }
        #toolbar .desc {
            display: block;
            color: #b9c6d1;
            margin-top: 6px;
            line-height: 1.35;
        }
        #phylogram1 {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        #errbox {
            color: #a00;
            padding: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div id="toolbar">
    <span class="title">🐦 Archaeopteryx.js</span> &nbsp;&middot;&nbsp; <a href="index.html">all demos&nbsp;↗</a>
    <select id="treePicker"></select>
</div>

<pre id="errbox"></pre>
<div id="phylogram1"></div>

<script>
    var TREES = {
        // Real ViPR/BV-BRC virus family trees first: larger than the rest, and
        // carrying the custom properties (Genus, Host, Species, Strain, Year)
        // the automatic visualizations have to make sense of.
        caliciviridae_100: {file: 'data/Caliciviridae_100.xml', label: 'Caliciviridae (97 strains)', desc: 'ViPR whole-genome tree with Genus, Host, Species, Strain and Year properties.'},
        caliciviridae_500: {file: 'data/Caliciviridae_500.xml', label: 'Caliciviridae (186 strains)', desc: 'The same family, larger sample.'},
        adenoviridae: {file: 'data/Adenoviridae.xml', label: 'Adenoviridae (321 strains)', desc: 'ViPR hexon-gene tree; the largest of the demos.'},
        flu_h5: {file: 'data/flu_h5.xml', label: 'Influenza A H5Nx (354 strains)', desc: 'BV-BRC tree carrying subtype, strain, species and genome id.'},
        herpes_dnapol: {file: 'data/herpes_dnapol.xml', label: 'Herpesviridae DNA polymerase (201 tips)', desc: 'The most heavily annotated demo: 13 BV-BRC properties, from host group to geography.'},
        // The classic smaller demos.
        influenza: {file: 'data/influenza.xml', label: 'Influenza HA (annotated)', desc: 'Richly annotated: Year, Country, Host, Subtype.'},
        apaf: {file: 'data/apaf.xml', label: 'Apaf-1 gene family', desc: 'A classic protein gene-family phylogeny.'},
        bcl2: {file: 'data/bcl2.xml', label: 'Bcl-2 family', desc: 'Bcl-2 proteins with node annotations.'},
        confidences: {file: 'data/confidences.xml', label: 'Confidence values', desc: 'A tree carrying branch support / confidence values.'},
        branch_events: {file: 'data/branch_events.xml', label: 'Branch events', desc: 'A tree with branch (duplication/speciation) events.'},
        alignment: {file: 'data/alignment.xml', label: 'Sequence alignment', desc: 'A six-tip tree with an embedded 34-column protein alignment (mol_seq).'},
        alignment_nt: {file: 'data/alignment_nt.xml', label: 'Nucleotide alignment (600 columns)', desc: 'A 16-tip tree with a 600-column nucleotide alignment: the track scrolls.'},
        dinosaur: {file: 'data/dinosaur-time-tree.xml', label: 'Dinosaur time tree', desc: 'Time-calibrated archosaurs with the coloured ICS geologic axis.'},
        ammonite: {file: 'data/ammonite-time-tree.xml', label: 'Ammonite time tree (fossil ranges)', desc: 'An all-extinct tree: the axis stops at the K-Pg, tips carry FAD/LAD range bars.'},
        sarscov2: {file: 'data/sars-cov-2-time-tree.xml', label: 'SARS-CoV-2 time tree (calendar)', desc: 'A tip-dated tree on a calendar-year axis, with HPD bars on dated nodes.'},
        auspice: {file: 'data/nextstrain-ncov.json', label: 'Auspice / Nextstrain JSON', desc: 'A Nextstrain v2 dataset.json: opens on the time view with node-age bars; Region, Country, Host and Clade become Color-by properties.'},
        beast: {file: 'data/beast-annotations.nex', label: 'BEAST annotations (Nexus)', desc: 'A TreeAnnotator-style tree: posterior support, node heights with 95% HPD intervals, and per-branch rates, read from the [&...] annotations.'},
        swh1: {file: 'data/swH1-HA1.nexus', label: 'Swine H1 HA1 + alignment (Nexus)', desc: 'One Nexus file carrying both: 50 swine influenza H1 strains (all 12 HA clades of the TreeSort swH1 dataset) and their 331-column HA1 protein alignment.'}
    };
    var DEFAULT_TREE = 'influenza';

    function currentTreeKey() {
        var params = new URLSearchParams(window.location.search);
        var t = params.get('tree');
        return (t && TREES[t]) ? t : DEFAULT_TREE;
    }

    function buildPicker() {
        var sel = document.getElementById('treePicker');
        Object.keys(TREES).forEach(function (key) {
            var opt = document.createElement('option');
            opt.value = key;
            opt.textContent = TREES[key].label;
            sel.appendChild(opt);
        });
        sel.value = currentTreeKey();
        // Reload with the chosen tree for a guaranteed-clean viewer state.
        sel.addEventListener('change', function () {
            window.location.search = '?tree=' + sel.value;
        });
    }

    function showError(msg) {
        document.getElementById('errbox').textContent = msg;
    }

    function loadTree() {
        var key = currentTreeKey();
        var tree = TREES[key];
        // The tree's own name/description (when present) is shown in the viewer's
        // control panel now, so the toolbar no longer repeats a description here.

        // Nothing to configure: the viewer works the display out from what
        // each tree actually contains -- including which fields to offer as
        // Color / Shape visualizations.
        var config = {
            enableDynamicSizing: true
        };

        fetch(tree.file, {cache: 'no-cache'})
            .then(function (r) {
                if (!r.ok) {
                    throw new Error('HTTP ' + r.status + ' loading ' + tree.file);
                }
                return r.text();
            })
            .then(function (data) {
                archaeopteryx.launchArchaeopteryx('#phylogram1', tree.file, data, config);
            })
            .catch(function (e) {
                showError('Could not load tree "' + key + '": ' + (e && e.message ? e.message : e));
            });
    }

    window.addEventListener('load', function () {
        buildPicker();
        loadTree();
    });
</script>
</body>
</html>
