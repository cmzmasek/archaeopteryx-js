<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="images/archaeopteryx-logo.png">
    <title>Archaeopteryx.js — Live Demo</title>

    <!-- Everything is served from this repository (GitHub Pages); there are no
         external dependencies to expire. Load order matters: sax before
         phyloxml, and forester/phyloxml/d3 before archaeopteryx. -->
    <script src="lib/d3.v7.min.js"></script>
    <script src="lib/sax.js"></script>
    <script src="lib/jspdf.umd.min.js"></script>
    <script src="lib/svg2pdf.umd.min.js"></script>
    <script src="lib/phyloxml.js"></script>
    <script src="lib/forester.js"></script>
    <script src="lib/archaeopteryx.js"></script>
    <script src="draggable-toolbar.js"></script>
    <!-- canvg 4.x publishes only ES modules (no classic-script global), so
         PNG export needs this small bridge -- archaeopteryx.js looks for
         window.Canvg, exactly the same "optional, embedder-supplied global"
         contract jsPDF/svg2pdf.js already use for PDF export above. A module
         script is deferred regardless of where it sits in the document, and
         PNG export only runs later from a user click, so the order here
         relative to the classic scripts above does not matter. -->
    <script type="module">
        import {Canvg} from './lib/canvg.js';

        window.Canvg = Canvg;
    </script>

    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Floating card in the top-right corner, clear of the tree's own
           control panel (which sits in the top-left) -- and draggable
           (draggable-toolbar.js), so it can be pulled off anything the tree
           puts in this corner, like the overview box. */
        #toolbar {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 1000;
            width: 250px;
            padding: 9px 12px;
            background: rgba(34, 48, 60, 0.95);
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            font-size: 13px;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }
        #toolbar.dragging {
            cursor: grabbing;
        }
        #toolbar .title {
            font-weight: 600;
        }
        #toolbar .logo {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            vertical-align: -3px;
            margin-right: 2px;
        }
        #toolbar a {
            color: #7fc4ff;
            text-decoration: none;
        }
        #toolbar select {
            font-size: 13px;
            padding: 4px 6px;
            width: 100%;
            margin-top: 6px;
            box-sizing: border-box;
        }
        #toolbar .desc {
            display: block;
            color: #b9c6d1;
            margin-top: 6px;
            line-height: 1.35;
        }
        #phylogram1 {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        /* No margin: an empty <pre> keeps its default 1em margin, and that
           pushed the page 13px taller than the window -- a scroll, or a
           trackpad flick, then slid the tree up over a white band. */
        #errbox {
            color: #a00;
            margin: 0;
            padding: 10px;
            white-space: pre-wrap;
        }
        #errbox:empty {
            display: none;
        }
    </style>
</head>
<body>
<div id="toolbar">
    <span class="title"><img class="logo" src="images/archaeopteryx-logo.png" srcset="images/archaeopteryx-logo.png 1x, images/archaeopteryx-logo@2x.png 2x" width="16" height="16" alt="">Archaeopteryx.js</span> &nbsp;&middot;&nbsp; <a href="index.html">all demos&nbsp;↗</a>
    <select id="treePicker"></select>
    <span class="desc"><a href="open.html">Open your own tree &rarr;</a></span>
    <span class="desc"><a href="#" id="shareView" title="Copies this page's address, the view included">Copy link to this view</a></span>
</div>

<pre id="errbox"></pre>
<div id="phylogram1"></div>

<script>
    // Keep this list, its order, and its content in sync with index.html
    // and the README's "Live demos" list.
    var TREES = {
        auspice: {file: 'data/nextstrain-ncov.json', label: 'Auspice / Nextstrain JSON', desc: 'A Nextstrain v2 dataset.json: opens on the time view with node-age bars; Region, Country, Host and Clade become Color-by properties.'},
        swh1: {file: 'data/swH1-HA1.nexus', label: 'Swine H1 HA1 + alignment (Nexus)', desc: 'One Nexus file carrying both: 50 swine influenza H1 strains (all 12 HA clades of the TreeSort swH1 dataset) and their 331-column HA1 protein alignment.'},
        beast: {file: 'data/beast-annotations.nex', label: 'BEAST annotations (Nexus)', desc: 'A TreeAnnotator-style tree: posterior support, node heights with 95% HPD intervals, and per-branch rates, read from the [&...] annotations.'},
        flavivirus: {file: 'data/flavivirus-mature-peptides.xml', label: 'Flavivirus mature peptides (10 trees)', desc: 'One phyloXML file holding ten trees, one per mature peptide of the flavivirus polyprotein (C, prM, E, NS1 … NS5) in genome order, 110–188 representative sequences each. Step through them with the picker at the top of the control panel, or Ctrl/⌘+Shift+< and >.'},
        sarscov2: {file: 'data/sars-cov-2-time-tree.xml', label: 'SARS-CoV-2 time tree (calendar)', desc: 'A tip-dated tree on a calendar-year axis, with HPD bars on dated nodes.'},
        herpes_dnapol: {file: 'data/herpes_dnapol.xml', label: 'Herpesviridae DNA polymerase (201 tips)', desc: 'The most heavily annotated demo: 13 BV-BRC properties, from host group to geography.'},
        caliciviridae_500: {file: 'data/Caliciviridae_500.xml', label: 'Caliciviridae (186 strains)', desc: 'ViPR whole-genome tree with Genus, Host, Species, Strain and Year properties.'},
        adenoviridae: {file: 'data/Adenoviridae.xml', label: 'Adenoviridae (321 strains)', desc: 'ViPR hexon-gene tree; the largest of the demos.'},
        apaf: {file: 'data/apaf.xml', label: 'Apaf-1 gene family', desc: 'The Apaf-1 / CED-4 family across the animals, each protein drawn with its domain architecture (CARD, NB-ARC, WD40 …) beside its tip. From Zmasek et al., Genome Biology 2007.'},
        alignment_nt: {file: 'data/alignment_nt.xml', label: 'Nucleotide alignment (600 columns)', desc: 'A 16-tip tree with a 600-column nucleotide alignment: the track scrolls.'},
        genome_alignment: {file: 'data/genome-alignment-synthetic.xml', label: 'Genome alignment (150 × 30,000 columns)', desc: '150 genome-length nucleotide sequences, 30,000 columns — a synthetic alignment evolved along a random tree, so related genomes really are alike and gap blocks follow clades. The track only ever draws the columns on screen; the bar beneath it pages, jumps to a column and reads back where you are. No real organism is represented.', config: {}},
        alignment: {file: 'data/alignment.xml', label: 'Sequence alignment', desc: 'A six-tip tree with an embedded 34-column protein alignment (mol_seq).'},
        sequence_logo: {file: 'data/lineage-operator-alignment.xml', label: 'Sequence logo (the motif changes by clade)', desc: 'Thirty strains in three lineages, all carrying the same operator in the same frame -- and each lineage carrying its own reading of it. The logo under the alignment is taken over the TIPS ON SCREEN, so over the whole file it shows the frame the three lineages share (GAC at 33-35, AT at 39-40) and little else: a position that is A in one lineage, T in the next and G in the third carries 0.4 of a bit. Click a lineage node, choose "Switch to Subtree", and that lineage&apos;s operator resolves into a crisp twelve-letter motif at the full 2 bits. Columns 55-66 show the other half of the rule: lineage C has a gap there, so over the whole file the block cannot rise above two thirds height however well the bases present agree. No real organism is represented.', config: {showMsa: true, showMsaLogo: true}},
        clustergram: {file: 'data/sparse-accessory-genome.xml', label: 'Clustergram (heat map + column clustering)', desc: 'A clustergram: 50 synthetic strains, and 18 accessory-genome genes as a heat map beside the tree. Each cell is an ordinal certainty 0–4 that the gene is present, on one shared colour scale; a cell nobody assessed is an outlined empty box, never read as absent. It opens clustered by co-occurrence, with the clustering drawn above the matrix — and it opens on the wrong answer, deliberately, overriding the order this viewer would otherwise have picked for it: the eight rare genes (six prophages and two hypotheticals, each in under 15% of the strains) sit in eight adjoining columns only because Euclidean distance counts the strains they are jointly ABSENT from as agreement. Switch Order columns to “Clustered (ignoring shared absence)” and watch them scatter to the capsule types they really occur with — that is the Bray–Curtis dissimilarity, and the double-zero problem it exists to fix. No real organism is represented.', config: {showHeatmap: true, heatmapColumnOrder: 'clustered'}},
        influenza: {file: 'data/influenza.xml', label: 'Influenza HA (annotated)', desc: 'Richly annotated: Year, Country, Host, Subtype.'},
        dinosaur: {file: 'data/dinosaur-time-tree.xml', label: 'Dinosaur time tree', desc: 'Time-calibrated archosaurs with the coloured ICS geologic axis.'},
        ammonite: {file: 'data/ammonite-time-tree.xml', label: 'Ammonite time tree (fossil ranges)', desc: 'An all-extinct tree: the axis stops at the K-Pg, tips carry FAD/LAD range bars.'},
        late_cretaceous: {file: 'data/late-cretaceous-time-tree.xml', label: 'Late Cretaceous time tree (stages)', desc: 'Thirteen well-known Late Cretaceous dinosaurs, Cenomanian to Maastrichtian. The whole tree sits inside one geologic Series, so the axis bands the Series over its six STAGES in ICS colours — the finer rung the Dinosaur and Ammonite trees are too wide to reach. Press X− a few times: the narrowest stages keep their colour and drop their names.', config: {}},
        bcl2: {file: 'data/bcl2.xml', label: 'Bcl-2 family', desc: 'Bcl-2 proteins with node annotations.'},
        confidences: {file: 'data/confidences.xml', label: 'Confidence values', desc: 'A tree carrying branch support / confidence values.'},
        branch_events: {file: 'data/branch_events.xml', label: 'Branch events', desc: 'A tree with branch (duplication/speciation) events.'},
        flu_h5: {file: 'data/flu_h5.xml', label: 'Influenza A H5Nx (354 strains)', desc: 'BV-BRC tree carrying subtype, strain, species and genome id.'},
        // The last three demos showcase launch settings rather than data: an
        // optional per-tree `config` is merged over the shared default below.
        circular: {file: 'data/herpes_dnapol.xml', label: 'Start circular', desc: 'The Herpesviridae demo opened in the circular layout, via the launch setting layout: \'circular\'.', config: {layout: 'circular'}},
        woese: {file: 'data/woese-tree-of-life.xml', label: 'Woese tree of life (start unrooted)', desc: 'Carl Woese\'s famous three-domain rRNA tree (1990), opened in the unrooted equal-angle layout it was made famous in, coloured by Domain.', config: {layout: 'unrooted'}},
        collapsed: {file: 'data/swH1-HA1.nexus', label: 'Start with collapsed controls', desc: 'The swine H1 demo opened with collapseControlPanel: true — the panel folds to its header bar (press + to expand), leaving the whole canvas to the tree and its alignment.', config: {collapseControlPanel: true}},
        flu_h5n1_seg3: {file: 'data/flu_h5n1_segment3.xml', label: 'H5N1 segment 3 (13,246 tips)', desc: 'The largest demo by far — 18,512 nodes: influenza A H5N1 segment 3 (PA) sequences from BV-BRC, most of them from the 2024–2025 North American outbreak in dairy cattle and birds, with 16 properties (host group, region, year, subclade, …). It opens behind a "Drawing 18,512 nodes" card and every redraw is coalesced — this is the tree the performance work was measured on.', config: {}}
    };
    var DEFAULT_TREE = 'influenza';

    function currentTreeKey() {
        var params = new URLSearchParams(window.location.search);
        var t = params.get('tree');
        return (t && TREES[t]) ? t : DEFAULT_TREE;
    }

    function buildPicker() {
        var sel = document.getElementById('treePicker');
        Object.keys(TREES).forEach(function (key) {
            var opt = document.createElement('option');
            opt.value = key;
            opt.textContent = TREES[key].label;
            sel.appendChild(opt);
        });
        sel.value = currentTreeKey();
        // Switch trees IN PLACE: the handle's destroy() unmounts the old
        // viewer completely (DOM, dialogs, page-level listeners), so no page
        // reload is needed. The URL still tracks the choice -- deep links and
        // the back/forward buttons keep working.
        sel.addEventListener('change', function () {
            history.pushState(null, '', '?tree=' + sel.value);
            loadTree();
        });
        window.addEventListener('popstate', function () {
            sel.value = currentTreeKey();
            loadTree();
        });
    }

    function showError(msg) {
        document.getElementById('errbox').textContent = msg;
    }

    var viewer = null;  // the handle returned by launchArchaeopteryx
    var loadSeq = 0;    // drops a slow fetch that finishes after a newer pick
    var BIG_INPUT_CHARS = 1000000;   // above this, parse behind the working card

    function loadTree() {
        var key = currentTreeKey();
        var tree = TREES[key];
        var seq = ++loadSeq;
        showError('');
        // The tree's own name/description (when present) is shown in the viewer's
        // control panel now, so the toolbar no longer repeats a description here.

        // Almost nothing to configure: the viewer works the display out from
        // what each tree actually contains -- including which fields to offer
        // as Color / Shape visualizations. A few demos exist to showcase a
        // launch setting, carried in their own `config` and merged here.
        var config = Object.assign({
            enableDynamicSizing: true
        }, tree.config || {});
        // The view rides in the URL hash: a shared link opens the tree as it
        // was left, and every change rewrites the hash in place (never a
        // history entry -- back and forward stay with the tree picker).
        var view = archaeopteryx.decodeViewState(window.location.hash);
        if (view) {
            config.view = view;
        }
        config.onViewChange = function (state, encoded) {
            history.replaceState(null, '', window.location.pathname + window.location.search + (encoded ? '#' + encoded : ''));
        };

        fetch(tree.file, {cache: 'no-cache'})
            .then(function (r) {
                if (!r.ok) {
                    throw new Error('HTTP ' + r.status + ' loading ' + tree.file);
                }
                return r.text();
            })
            .then(function (data) {
                if (seq !== loadSeq) {
                    return;
                }
                if (viewer) {
                    viewer.destroy();
                    viewer = null;
                }
                function launch() {
                    if (seq !== loadSeq) {
                        return;   // a newer pick arrived during the deferral
                    }
                    viewer = archaeopteryx.launchArchaeopteryx('#phylogram1', tree.file, data, config);
                }
                // launchArchaeopteryx parses synchronously, and a big file
                // takes seconds to parse -- long enough to look frozen. The
                // viewer's own "working" card covers that: it is painted
                // first, the parse runs on the next frame, and the viewer
                // then swaps in its "Drawing" card for the draw itself.
                if (data.length >= BIG_INPUT_CHARS) {
                    archaeopteryx.busy('#phylogram1',
                        'Reading ' + tree.label, (data.length / 1048576).toFixed(1) + ' MB', launch);
                } else {
                    launch();
                }
            })
            .catch(function (e) {
                if (seq !== loadSeq) {
                    return;
                }
                showError('Could not load tree "' + key + '": ' + (e && e.message ? e.message : e));
            });
    }

    window.addEventListener('load', function () {
        buildPicker();
        document.getElementById('shareView').addEventListener('click', function (e) {
            e.preventDefault();
            var link = this;
            var done = function (ok) {
                link.textContent = ok ? 'Link copied' : 'Could not copy \u2014 use the address bar';
                setTimeout(function () {
                    link.textContent = 'Copy link to this view';
                }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(window.location.href).then(function () {
                    done(true);
                }, function () {
                    done(false);
                });
            } else {
                done(false);
            }
        });
        loadTree();
        makeToolbarDraggable(document.getElementById('toolbar'), 'aptx-demo-toolbar-pos');
    });
</script>
</body>
</html>
