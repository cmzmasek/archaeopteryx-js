<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="images/archaeopteryx-logo.png">
    <title>Archaeopteryx.js — Live Demo</title>

    <!-- Everything is served from this repository (GitHub Pages); there are no
         external dependencies to expire. Load order matters: sax before
         phyloxml, and forester/phyloxml/d3 before archaeopteryx. -->
    <script src="lib/d3.v7.min.js"></script>
    <script src="lib/sax.js"></script>
    <script src="lib/jspdf.umd.min.js"></script>
    <script src="lib/svg2pdf.umd.min.js"></script>
    <script src="lib/phyloxml.js"></script>
    <script src="lib/forester.js"></script>
    <script src="lib/archaeopteryx.js"></script>
    <!-- canvg 4.x publishes only ES modules (no classic-script global), so
         PNG export needs this small bridge -- archaeopteryx.js looks for
         window.Canvg, exactly the same "optional, embedder-supplied global"
         contract jsPDF/svg2pdf.js already use for PDF export above. A module
         script is deferred regardless of where it sits in the document, and
         PNG export only runs later from a user click, so the order here
         relative to the classic scripts above does not matter. -->
    <script type="module">
        import {Canvg} from './lib/canvg.js';

        window.Canvg = Canvg;
    </script>

    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Floating card in the top-right corner, clear of the tree's own
           control panel (which sits in the top-left). */
        #toolbar {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 1000;
            width: 250px;
            padding: 9px 12px;
            background: rgba(34, 48, 60, 0.95);
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            font-size: 13px;
        }
        #toolbar .title {
            font-weight: 600;
        }
        #toolbar .logo {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            vertical-align: -3px;
            margin-right: 2px;
        }
        #toolbar a {
            color: #7fc4ff;
            text-decoration: none;
        }
        #toolbar select {
            font-size: 13px;
            padding: 4px 6px;
            width: 100%;
            margin-top: 6px;
            box-sizing: border-box;
        }
        #toolbar .desc {
            display: block;
            color: #b9c6d1;
            margin-top: 6px;
            line-height: 1.35;
        }
        #phylogram1 {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        #errbox {
            color: #a00;
            padding: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div id="toolbar">
    <span class="title"><img class="logo" src="images/archaeopteryx-logo.png" srcset="images/archaeopteryx-logo.png 1x, images/archaeopteryx-logo@2x.png 2x" width="16" height="16" alt="">Archaeopteryx.js</span> &nbsp;&middot;&nbsp; <a href="index.html">all demos&nbsp;↗</a>
    <select id="treePicker"></select>
    <span class="desc"><a href="open.html">Open your own tree &rarr;</a></span>
</div>

<pre id="errbox"></pre>
<div id="phylogram1"></div>

<script>
    // Keep this list, its order, and its content in sync with index.html
    // and the README's "Live demos" list.
    var TREES = {
        auspice: {file: 'data/nextstrain-ncov.json', label: 'Auspice / Nextstrain JSON', desc: 'A Nextstrain v2 dataset.json: opens on the time view with node-age bars; Region, Country, Host and Clade become Color-by properties.'},
        swh1: {file: 'data/swH1-HA1.nexus', label: 'Swine H1 HA1 + alignment (Nexus)', desc: 'One Nexus file carrying both: 50 swine influenza H1 strains (all 12 HA clades of the TreeSort swH1 dataset) and their 331-column HA1 protein alignment.'},
        beast: {file: 'data/beast-annotations.nex', label: 'BEAST annotations (Nexus)', desc: 'A TreeAnnotator-style tree: posterior support, node heights with 95% HPD intervals, and per-branch rates, read from the [&...] annotations.'},
        sarscov2: {file: 'data/sars-cov-2-time-tree.xml', label: 'SARS-CoV-2 time tree (calendar)', desc: 'A tip-dated tree on a calendar-year axis, with HPD bars on dated nodes.'},
        herpes_dnapol: {file: 'data/herpes_dnapol.xml', label: 'Herpesviridae DNA polymerase (201 tips)', desc: 'The most heavily annotated demo: 13 BV-BRC properties, from host group to geography.'},
        caliciviridae_500: {file: 'data/Caliciviridae_500.xml', label: 'Caliciviridae (186 strains)', desc: 'ViPR whole-genome tree with Genus, Host, Species, Strain and Year properties.'},
        adenoviridae: {file: 'data/Adenoviridae.xml', label: 'Adenoviridae (321 strains)', desc: 'ViPR hexon-gene tree; the largest of the demos.'},
        alignment_nt: {file: 'data/alignment_nt.xml', label: 'Nucleotide alignment (600 columns)', desc: 'A 16-tip tree with a 600-column nucleotide alignment: the track scrolls.'},
        alignment: {file: 'data/alignment.xml', label: 'Sequence alignment', desc: 'A six-tip tree with an embedded 34-column protein alignment (mol_seq).'},
        influenza: {file: 'data/influenza.xml', label: 'Influenza HA (annotated)', desc: 'Richly annotated: Year, Country, Host, Subtype.'},
        dinosaur: {file: 'data/dinosaur-time-tree.xml', label: 'Dinosaur time tree', desc: 'Time-calibrated archosaurs with the coloured ICS geologic axis.'},
        ammonite: {file: 'data/ammonite-time-tree.xml', label: 'Ammonite time tree (fossil ranges)', desc: 'An all-extinct tree: the axis stops at the K-Pg, tips carry FAD/LAD range bars.'},
        apaf: {file: 'data/apaf.xml', label: 'Apaf-1 gene family', desc: 'A classic protein gene-family phylogeny.'},
        bcl2: {file: 'data/bcl2.xml', label: 'Bcl-2 family', desc: 'Bcl-2 proteins with node annotations.'},
        confidences: {file: 'data/confidences.xml', label: 'Confidence values', desc: 'A tree carrying branch support / confidence values.'},
        branch_events: {file: 'data/branch_events.xml', label: 'Branch events', desc: 'A tree with branch (duplication/speciation) events.'},
        flu_h5: {file: 'data/flu_h5.xml', label: 'Influenza A H5Nx (354 strains)', desc: 'BV-BRC tree carrying subtype, strain, species and genome id.'},
        // The last three demos showcase launch settings rather than data: an
        // optional per-tree `config` is merged over the shared default below.
        circular: {file: 'data/herpes_dnapol.xml', label: 'Start circular', desc: 'The Herpesviridae demo opened in the circular layout, via the launch setting layout: \'circular\'.', config: {layout: 'circular'}},
        woese: {file: 'data/woese-tree-of-life.xml', label: 'Woese tree of life (start unrooted)', desc: 'Carl Woese\'s famous three-domain rRNA tree (1990), opened in the unrooted equal-angle layout it was made famous in, coloured by Domain.', config: {layout: 'unrooted'}},
        collapsed: {file: 'data/swH1-HA1.nexus', label: 'Start with collapsed controls', desc: 'The swine H1 demo opened with collapseControlPanel: true — the panel folds to its header bar (press + to expand), leaving the whole canvas to the tree and its alignment.', config: {collapseControlPanel: true}}
    };
    var DEFAULT_TREE = 'influenza';

    function currentTreeKey() {
        var params = new URLSearchParams(window.location.search);
        var t = params.get('tree');
        return (t && TREES[t]) ? t : DEFAULT_TREE;
    }

    function buildPicker() {
        var sel = document.getElementById('treePicker');
        Object.keys(TREES).forEach(function (key) {
            var opt = document.createElement('option');
            opt.value = key;
            opt.textContent = TREES[key].label;
            sel.appendChild(opt);
        });
        sel.value = currentTreeKey();
        // Switch trees IN PLACE: the handle's destroy() unmounts the old
        // viewer completely (DOM, dialogs, page-level listeners), so no page
        // reload is needed. The URL still tracks the choice -- deep links and
        // the back/forward buttons keep working.
        sel.addEventListener('change', function () {
            history.pushState(null, '', '?tree=' + sel.value);
            loadTree();
        });
        window.addEventListener('popstate', function () {
            sel.value = currentTreeKey();
            loadTree();
        });
    }

    function showError(msg) {
        document.getElementById('errbox').textContent = msg;
    }

    var viewer = null;  // the handle returned by launchArchaeopteryx
    var loadSeq = 0;    // drops a slow fetch that finishes after a newer pick

    function loadTree() {
        var key = currentTreeKey();
        var tree = TREES[key];
        var seq = ++loadSeq;
        showError('');
        // The tree's own name/description (when present) is shown in the viewer's
        // control panel now, so the toolbar no longer repeats a description here.

        // Almost nothing to configure: the viewer works the display out from
        // what each tree actually contains -- including which fields to offer
        // as Color / Shape visualizations. A few demos exist to showcase a
        // launch setting, carried in their own `config` and merged here.
        var config = Object.assign({
            enableDynamicSizing: true
        }, tree.config || {});

        fetch(tree.file, {cache: 'no-cache'})
            .then(function (r) {
                if (!r.ok) {
                    throw new Error('HTTP ' + r.status + ' loading ' + tree.file);
                }
                return r.text();
            })
            .then(function (data) {
                if (seq !== loadSeq) {
                    return;
                }
                if (viewer) {
                    viewer.destroy();
                    viewer = null;
                }
                viewer = archaeopteryx.launchArchaeopteryx('#phylogram1', tree.file, data, config);
            })
            .catch(function (e) {
                if (seq !== loadSeq) {
                    return;
                }
                showError('Could not load tree "' + key + '": ' + (e && e.message ? e.message : e));
            });
    }

    window.addEventListener('load', function () {
        buildPicker();
        loadTree();
    });
</script>
</body>
</html>
