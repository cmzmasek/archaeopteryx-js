<!doctype html>
<meta charset="utf-8"><title>aptx: node metadata in the label, and the figure's label choices</title>
<style>html,body{margin:0;height:100%}#p{position:absolute;inset:0}</style>
<script src="../../docs/lib/d3.v7.min.js"></script>
<script src="../../docs/lib/sax.js"></script>
<script src="../../docs/lib/phyloxml.js"></script>
<script src="../../docs/lib/forester.js"></script>
<script src="../../docs/lib/archaeopteryx.js"></script>
<div id="p"></div>
<script>
// Christian, 2026-09-30, on the BV-BRC Brucella file: the tips were labelled
// with accession numbers nobody uses, and the species -- a node property --
// could not be turned on. Now, as on the desktop: a "Properties" label
// checkbox (off by default, offered when nodes carry properties) and a Label
// fields chooser; values only, " | "-joined; with nothing chosen, every
// property but the heat map's columns. And the desktop's figure setting can
// say it: labelprops, show.SHOW_PROPERTIES, show.SHOW_NODE_NAMES.
//
// The tree is built here: 6 tips named like accessions, each with a species,
// a host (missing on one tip), a unit-bearing length, and two gene counts
// (a heat map's worth).
//
//   (no query)   the checkbox, the default fields, the chooser, the view
//   ?figure=1    the figure says: label with species, hide the names
//   ?config=1    ... and the config says Properties off, which wins
//   ?nodeLabels=1 the retired key: one warning, no checkbox, no effect
(async function () {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const byId = (id) => document.getElementById(id);
    const out = []; let failures = 0;
    const check = (l, ok, d) => { if (!ok) { failures++; }
        out.push((ok ? 'pass  ' : 'FAIL  ') + l + (d === undefined ? '' : '   [' + d + ']')); };
    const q = new URLSearchParams(location.search);
    const figure = q.get('figure') === '1' || q.get('config') === '1';
    const prop = (ref, v, extra) => '<property ref="' + ref + '" datatype="xsd:string" applies_to="node"' + (extra || '') + '>' + v + '</property>';
    const SPECIES = ['Brucella lupini', 'Brucella ceti', 'Brucella suis', 'Brucella ovis', 'Brucella canis', 'Brucella suis'];
    const tip = (i) => '<clade><name>2554' + i + '.3</name><branch_length>0.1</branch_length>'
        + prop('BVBRC:species', SPECIES[i]) + (i === 2 ? '' : prop('BVBRC:host_name', 'host' + i))
        + prop('x:len', String(10 + i), ' unit="METRIC:bp"')
        + '<property ref="pg:a" datatype="xsd:integer" applies_to="node">' + (i % 3) + '</property>'
        + '<property ref="pg:b" datatype="xsd:integer" applies_to="node">' + (i % 2) + '</property></clade>';
    const fig = 'v1;labelprops=BVBRC:species;show.SHOW_PROPERTIES=true;show.SHOW_NODE_NAMES=false;columns='
        + 'pg:a\\sMATRIX\\sCIRCLE\\sfalse\\ppg:b\\sMATRIX\\sCIRCLE\\sfalse';
    const xml = '<?xml version="1.0" encoding="UTF-8"?><phyloxml xmlns="http://www.phyloxml.org"><phylogeny rooted="true">'
        + '<clade><clade><branch_length>0.2</branch_length>' + tip(0) + tip(1) + tip(2) + '</clade>'
        + '<clade><branch_length>0.2</branch_length>' + tip(3) + tip(4) + tip(5) + '</clade></clade>'
        + (figure ? '<property ref="aptx:figure" datatype="xsd:string" applies_to="phylogeny">' + fig + '</property>' : '')
        + '</phylogeny></phyloxml>';
    const labelOf = (name) => { const t = [...document.querySelectorAll('#p g.node')].find((g) => g.__data__
        && g.__data__.name === name); const x = t && t.querySelector('text.extlabel'); return x ? x.textContent : null; };
    const settle = () => sleep(1600);
    // what the old BV-BRC virus widget passed, cut to two: one field the tree
    // has (ticked from the start), one it lacks
    const NODE_LABELS = {Host: {label: 'Host', description: 'to use the host as part of node names',
        propertyRef: 'BVBRC:host_name', selected: true, showButton: true},
        Region: {label: 'Region', description: 'to use the region as part of node names',
        propertyRef: 'vipr:Region', selected: false, showButton: true}};
    const warned = [];
    const realWarn = console.warn;
    console.warn = function () { warned.push(Array.from(arguments).join(' ')); realWarn.apply(console, arguments); };
    try {
        const trees = archaeopteryx.parseTrees('props.xml', xml);
        const viewer = archaeopteryx.launch('#p', trees, q.get('config') === '1' ? {showProperties: false}
            : (q.get('nodeLabels') === '1' ? {nodeLabels: NODE_LABELS} : {}));
        await viewer.ready;
        await sleep(2200);
        console.warn = realWarn;
        const cb = byId('props_cb');
        if (q.get('nodeLabels') === '1') {
            // nodeLabels retired (3.25.0): the key is accepted with one warning
            // and declares nothing -- no checkbox, no label text, no view flag.
            // BV-BRC passed a fixed list of eight on every virus tree, six of
            // them for fields the tree did not have.
            const ours = warned.filter((w) => /"nodeLabels"/.test(w));
            check('exactly one warning, naming the key as retired and pointing at Metadata',
                ours.length === 1 && /retired and has no effect/.test(ours[0]) && /Metadata/.test(ours[0]), ours.join(' || '));
            check('no custom checkbox is offered', !byId('Host__cb') && !byId('Region__cb')
                && document.querySelectorAll('.aptx-panel input[id$="__cb"]').length === 0,
                [...document.querySelectorAll('.aptx-panel input[id$="__cb"]')].map((i) => i.id).join(','));
            check('Metadata is offered, and off', !!cb && !cb.checked);
            check('a selected entry labels nothing: the label is the name alone', labelOf('25540.3') === '25540.3', labelOf('25540.3'));
            const vs = viewer.getViewState();
            check('the view carries no custom: flag', !vs.show.some((f) => /^custom:/.test(f)), vs.show.join(','));
            viewer.applyViewState({show: ['name', 'external', 'custom:Host'], labelFields: ['BVBRC:host_name']}); await settle();
            check('a 3.24.0 hash with a custom: flag is read, the flag ignored', labelOf('25540.3') === '25540.3', labelOf('25540.3'));
        } else if (q.get('config') === '1') {
            check('the config\'s showProperties: false wins over the figure', !!cb && !cb.checked);
            check('... the names stay off as the figure says, so nothing shows', labelOf('25540.3') === '' || labelOf('25540.3') === null,
                JSON.stringify(labelOf('25540.3')));
        } else if (figure) {
            check('the figure turns Properties on', !!cb && cb.checked);
            check('... and the names off', !byId('nn_cb').checked);
            check('... and labels with the species alone', labelOf('25540.3') === 'Brucella lupini'
                && labelOf('25542.3') === 'Brucella suis', labelOf('25540.3') + ' / ' + labelOf('25542.3'));
            check('the heat map still opens from the same figure', byId('heatmap_cb').checked);
        } else {
            check('Metadata is offered, and off by default', !!cb && !cb.checked);
            // The word a user sees is "Metadata", never phyloXML's "properties"
            // (Christian, 2026-10-01): the checkbox, the chooser's button, title
            // and lead, and nothing else in the panel -- the tree-statistics
            // button's "Tree properties" (the tree's own characteristics) aside.
            const label = cb.closest('label');
            check('the checkbox says Metadata', label && label.textContent.trim() === 'Metadata'
                && /metadata/i.test(label.title) && !/propert[^)]*$/i.test(label.title.replace(/\(phyloXML properties[^)]*\)/, '')),
            label && (label.textContent.trim() + ' / ' + label.title));
            const fieldsBtn = byId('label_fields_b');
            check('the chooser button says Metadata fields…', fieldsBtn && fieldsBtn.value === 'Metadata fields…'
                && !/propert/i.test(fieldsBtn.title), fieldsBtn && (fieldsBtn.value + ' / ' + fieldsBtn.title));
            const stray = [...document.querySelectorAll('.aptx-panel *')].filter((el) => {
                const own = [...el.childNodes].filter((n) => n.nodeType === 3).map((n) => n.textContent).join('');
                const text = own + ' ' + (el.title || '') + ' ' + (el.value || '');
                return /propert/i.test(text.replace(/\(phyloXML properties[^)]*\)/g, '')) && !/Tree properties/.test(text);
            }).map((el) => (el.textContent || el.value || '').trim().slice(0, 40) + ' | ' + (el.title || '').slice(0, 60));
            check('no other panel text says "properties"', stray.length === 0, stray.join(' ;; '));
            fieldsBtn.click(); await sleep(300);
            const dlg = document.querySelector('dialog[open]');
            check('the chooser is titled Metadata fields, and its lead says metadata fields', !!dlg
                && /Metadata fields/.test(dlg.textContent) && /Tick the metadata fields the labels show; drag/.test(dlg.textContent)
                && !/propert/i.test(dlg.textContent), dlg && dlg.textContent.slice(0, 120));
            [...dlg.querySelectorAll('.aptx-reps-actions button')].find((b) => b.textContent === 'Cancel').click();
            await sleep(200);
            check('... the labels are the names', labelOf('25540.3') === '25540.3', labelOf('25540.3'));
            cb.click(); await settle();
            // the heat map is off, so its columns are ordinary fields here
            check('ticked: every property, values only, " | "-joined, a unit without its namespace',
                labelOf('25540.3') === '25540.3 | Brucella lupini | host0 | 10 bp | 0 | 0', labelOf('25540.3'));
            check('... and a field a node lacks is simply skipped', labelOf('25542.3') === '25542.3 | Brucella suis | 12 bp | 2 | 0',
                labelOf('25542.3'));
            byId('heatmap_cb').click(); await settle();
            // x:len is numeric too, so the heat map takes it as a third column
            check('with the heat map shown, its columns leave the default label',
                labelOf('25540.3') === '25540.3 | Brucella lupini | host0', labelOf('25540.3'));

            // the chooser: tick only Species and Host Name, Species first
            cb.click(); await settle();          // off again: picking a field must turn it on
            byId('label_fields_b').click(); await sleep(300);
            const rows = () => [...document.querySelectorAll('.aptx-reorder-row')];
            const nameOf = (r) => r.querySelector('.aptx-reorder-name').title;
            check('the chooser offers every visible property', rows().length === 5,
                rows().map(nameOf).join(','));
            check('... ticked as the label shows them by default (not the heat map\'s)', rows().filter((r) =>
                r.querySelector('input').checked).map(nameOf).join(',') === 'BVBRC:host_name,BVBRC:species',
            rows().filter((r) => r.querySelector('input').checked).map(nameOf).join(','));
            // Species above Host by DRAGGING its row to the top (the rows'
            // grab cursor promised this; the chooser had only the arrows)
            const drag = (row, toY, from) => {
                const y0 = row.getBoundingClientRect().top + 4;
                (from || row.querySelector('.aptx-reorder-name')).dispatchEvent(new PointerEvent('pointerdown', {bubbles: true, clientY: y0, clientX: 5}));
                window.dispatchEvent(new PointerEvent('pointermove', {clientY: toY, clientX: 5}));
                window.dispatchEvent(new PointerEvent('pointerup', {clientY: toY, clientX: 5}));
            };
            const topY = () => rows()[0].getBoundingClientRect().top + 2;
            let sp = rows().findIndex((r) => nameOf(r) === 'BVBRC:species');
            check('Species starts below Host', sp === 1, sp);
            drag(rows()[sp], topY());
            await sleep(100);
            check('dragged to the top, it is first', nameOf(rows()[0]) === 'BVBRC:species', rows().map(nameOf).join(','));
            // a press on the checkbox ticks it, it does not start a drag
            const hostRow = rows()[1];
            const hostBox = hostRow.querySelector('input');
            const wasOn = hostBox.checked;
            drag(hostRow, topY(), hostBox);
            await sleep(100);
            check('a press on a checkbox is not a drag', nameOf(rows()[0]) === 'BVBRC:species' && nameOf(rows()[1]) === 'BVBRC:host_name',
                rows().map(nameOf).join(','));
            if (hostBox.checked !== wasOn) { hostBox.click(); }
            // All and None tick the boxes and keep the dialog open (All used
            // to close it at once)
            const action = (name) => [...document.querySelectorAll('.aptx-reps-actions button')].find((b) => b.textContent === name);
            const ticked = () => rows().filter((r) => r.querySelector('input').checked).map(nameOf);
            action('All').click(); await sleep(100);
            check('All ticks every field and stays open', !!document.querySelector('dialog[open]') && ticked().length === rows().length,
                ticked().length + ' of ' + rows().length + (document.querySelector('dialog[open]') ? '' : ', dialog closed'));
            action('None').click(); await sleep(100);
            check('None unticks every field and stays open', !!document.querySelector('dialog[open]') && ticked().length === 0, ticked().join(','));
            rows().forEach((r) => { if (['BVBRC:species', 'BVBRC:host_name'].indexOf(nameOf(r)) >= 0) { r.querySelector('input').click(); } });
            [...document.querySelectorAll('.aptx-reps-actions button')].find((b) => b.textContent === 'Apply').click();
            await settle();
            check('Apply: the chosen fields, in the chosen order', labelOf('25540.3') === '25540.3 | Brucella lupini | host0',
                labelOf('25540.3'));
            check('... and picking fields turned Properties on', cb.checked);

            const vs = viewer.getViewState();
            check('the view carries the checkbox and the fields', vs.show.indexOf('properties') >= 0
                && JSON.stringify(vs.labelFields) === JSON.stringify(['BVBRC:species', 'BVBRC:host_name']),
                JSON.stringify(vs.labelFields));
            const hash = archaeopteryx.encodeViewState ? archaeopteryx.encodeViewState(vs) : null;
            viewer.applyViewState({show: ['name', 'external'], labelFields: ['BVBRC:host_name']}); await settle();
            check('an applied view turns it off', !cb.checked && labelOf('25540.3') === '25540.3', labelOf('25540.3'));
            viewer.applyViewState({show: ['name', 'external', 'properties'], labelFields: ['BVBRC:host_name']}); await settle();
            check('... and on, with its own fields', cb.checked && labelOf('25540.3') === '25540.3 | host0', labelOf('25540.3'));
            if (hash !== null) {
                check('the fields survive the hash', /labelFields=BVBRC:species,BVBRC:host_name/.test(hash), hash);
            }
        }
    } catch (e) {
        check('harness ran', false, e && e.stack);
    }
    window.__benchResult = {report: out, failures: failures};
    window.__benchDone = true;
})();
</script>
