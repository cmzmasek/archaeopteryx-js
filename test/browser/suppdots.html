<!doctype html>
<meta charset="utf-8"><title>aptx: does every support dot sit on its branch?</title>
<style>html,body{margin:0;height:100%}#phylogram1{position:absolute;inset:0}</style>
<script src="../../docs/lib/d3.v7.min.js"></script>
<script src="../../docs/lib/sax.js"></script>
<script src="../../docs/lib/phyloxml.js"></script>
<script src="../../docs/lib/forester.js"></script>
<script src="../../docs/lib/archaeopteryx.js"></script>
<div id="phylogram1"></div>
<script>
// Christian, 2026-09-28: "some dots float in empty space ... only in sub
// trees, esp sub tree of subtree". A subtree view hangs its top node from a
// wrapper made when the subtree was entered, while the node's own `parent`
// is still its parent in the whole tree -- laid out long ago, somewhere else.
// Every mark placed "halfway back to the parent" went there.
//
// So: in a subtree, and a subtree inside that one, in each layout and display
// type, every support dot's centre must lie ON a drawn branch -- asked of the
// branch paths themselves (isPointInStroke), never of the formula that placed
// the dot.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const out = []; let failures = 0;
const check = (l, ok, d) => { if (!ok) { failures++; }
    out.push((ok ? 'pass  ' : 'FAIL  ') + l + (d === undefined ? '' : '   [' + d + ']')); };
const byId = (id) => document.getElementById(id);
const click = async (id, ms) => { byId(id).closest('label') ? byId(id).closest('label').click() : byId(id).click();
    await sleep(ms || 1200); };

// every visible mark whose anchor is on no branch stroke (within 1.5 px): a
// dot's centre; a number's anchor (its x, before the dy that lifts or lowers
// the text off the branch) -- the dots, the confidence values and the branch
// lengths all go through the same parent-relative placement
const MARKS = {
    'support dots': {sel: 'circle.suppdot', shown: (c) => +c.getAttribute('r') > 0,
        at: (c) => [+c.getAttribute('cx'), +(c.getAttribute('cy') || 0)]},
    'confidence values': {sel: 'text.conflabel', shown: (t) => t.textContent.trim() !== '',
        at: (t) => [+(t.getAttribute('x') || 0), 0]},
    'branch lengths': {sel: 'text.bllabel', shown: (t) => t.textContent.trim() !== '',
        at: (t) => [+(t.getAttribute('x') || 0), 0]}
};
function floatingMarks(kind) {
    const k = MARKS[kind];
    const branches = [...document.querySelectorAll('g.aptx-branches path')];
    const dots = [...document.querySelectorAll(k.sel)].filter(k.shown);
    const svg = dots.length ? dots[0].ownerSVGElement : null;
    let off = [];
    for (const c of dots) {
        const m = c.getScreenCTM();
        const p = svg.createSVGPoint();
        [p.x, p.y] = k.at(c);
        const screen = p.matrixTransform(m);
        let on = false;
        for (const b of branches) {
            const inv = b.getScreenCTM().inverse();
            for (const [ox, oy] of [[0, 0], [1.5, 0], [-1.5, 0], [0, 1.5], [0, -1.5]]) {
                const q = svg.createSVGPoint();
                q.x = screen.x + ox;
                q.y = screen.y + oy;
                if (b.isPointInStroke(q.matrixTransform(inv))) {
                    on = true;
                    break;
                }
            }
            if (on) { break; }
        }
        if (!on) { off.push(Math.round(screen.x) + ',' + Math.round(screen.y)); }
    }
    return {dots: dots.length, off: off};
}

(async function () {
    const file = '../../docs/data/swH1-HA1.nexus';
    const trees = archaeopteryx.parseTrees(file, await (await fetch(file)).text());
    const tree = Array.isArray(trees) ? trees[0] : trees;
    const viewer = archaeopteryx.launch('#phylogram1', trees);
    await viewer.ready;
    await sleep(1500);
    for (const id of ['suppdots_cb', 'conf_cb', 'bl_cb']) { if (!byId(id).checked) { byId(id).click(); await sleep(500); } }

    const N = forester.getAllExternalNodes(tree).length;
    const tipsUnder = (n) => forester.getAllExternalNodes(n).length;
    const supported = (n) => n.confidences && n.confidences.length && n.confidences[0].value >= 0.95;
    const all = [];
    forester.preOrderTraversalAll(tree, (n) => all.push(n));
    // a subtree whose own top branch carries a dot, and inside it another
    // TWO levels down at least, each time: a clade hanging straight from the
    // view's top node has a parent at y=0 whatever went stale, and the first
    // version of this file picked exactly those -- and passed on the bug
    const deepIn = (n, top) => n.parent && n.parent !== top && n.parent.parent;
    const outer = all.filter((n) => n.children && deepIn(n, tree.children[0]) && supported(n)
        && tipsUnder(n) >= 12 && tipsUnder(n) <= N - 10).sort((a, b) => tipsUnder(b) - tipsUnder(a))[0];
    const inner = [];
    forester.preOrderTraversalAll(outer, (n) => inner.push(n));
    const deep = inner.filter((n) => n !== outer && n.children && n.parent !== outer && supported(n) && tipsUnder(n) >= 5)
        .sort((a, b) => tipsUnder(b) - tipsUnder(a))[0];
    out.push('subtree ' + outer.viewId + ' (' + tipsUnder(outer) + ' tips), inside it ' + deep.viewId
        + ' (' + tipsUnder(deep) + ' tips)');

    const views = [['whole tree', null], ['subtree', outer], ['subtree of the subtree', deep]];
    const layouts = [['rectangular', 'layout_rect_b'], ['circular', 'layout_circ_b'], ['unrooted', 'layout_unrooted_b']];
    const displays = [['phylogram', 'phy_b'], ['cladogram', 'cla_b']];
    const drawn = {};
    const shotAt = new URLSearchParams(location.search).get('shot');
    for (const [vname, node] of views) {
        if (node) {
            // the way a user does it: click the node, choose Switch to Subtree
            const g = [...document.querySelectorAll('g.node')].find((x) => x.__data__ === node);
            const m = g.getScreenCTM();
            const at = {clientX: m.e, clientY: m.f, bubbles: true, cancelable: true, view: window};
            const svg = g.ownerSVGElement;
            svg.dispatchEvent(new MouseEvent('mousemove', at));
            svg.dispatchEvent(new MouseEvent('click', at));
            await sleep(300);
            const item = [...document.querySelectorAll('.aptx-node-menu button')]
                .find((b) => b.textContent === 'Switch to Subtree');
            check(vname + ': entered from the node menu', !!item);
            if (!item) { break; }
            item.click();
            await sleep(1500);
        }
        for (const [lname, lid] of layouts) {
            await click(lid);
            for (const [dname, did] of displays) {
                if (byId(did).disabled) { continue; }
                await click(did);
                for (const kind of Object.keys(MARKS)) {
                    const r = floatingMarks(kind);
                    // a crowded fan may hide every number of a kind (auto-hide);
                    // only the dots must be there in every view -- the numbers
                    // must be there SOMEWHERE in each view, counted below
                    drawn[vname + '/' + kind] = (drawn[vname + '/' + kind] || 0) + r.dots;
                    check(vname + ', ' + lname + ', ' + dname + ': every one of the ' + kind + ' is on a branch',
                        (kind !== 'support dots' || r.dots > 0) && r.off.length === 0,
                        r.dots + ' drawn' + (r.off.length ? ', off a branch at ' + r.off.slice(0, 4).join(' ') : ''));
                }
            }
        }
        if (shotAt && vname === shotAt) {
            await click('layout_rect_b');
            await click('cla_b');
            break;   // leave it on screen for the screenshot
        }
        await click('layout_rect_b');
    }
    for (const [key, n] of Object.entries(drawn)) {
        check(key + ': drawn at all, so the checks above tested something', n > 0, n);
    }
    window.__benchResult = {report: out, failures: failures};
    window.__benchDone = true;
})().catch((e) => { check('the harness ran', false, String(e && e.stack || e));
    window.__benchResult = {report: out, failures: failures}; window.__benchDone = true; });
</script>
