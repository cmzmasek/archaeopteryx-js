<!doctype html>
<meta charset="utf-8"><title>aptx: a saved figure's switches are honoured</title>
<style>html,body{margin:0;height:100%}#p{position:absolute;inset:0}</style>
<script src="../../docs/lib/d3.v7.min.js"></script>
<script src="../../docs/lib/sax.js"></script>
<script src="../../docs/lib/phyloxml.js"></script>
<script src="../../docs/lib/forester.js"></script>
<script src="../../docs/lib/archaeopteryx.js"></script>
<div id="p"></div>
<script>
// The desktop's figure setting (aptx:figure) names its display switches
// (show.WRITE_CONFIDENCE_VALUES=false ...), its layout and its displaytype.
// Since its 0.11.199 a saved figure wins over the desktop's load-time
// guesses; here the same, for every switch this viewer has a control for,
// the config still winning over the figure. test/heatmap_test.js pins the
// reader; this is the launch path. The trees are the desktop's own demo pair
// (forester/demo at 0.11.199, byte-identical in test/data): saved-figure.xml
// carries a figure naming every guessed switch off and
// displaytype=ALIGNED_PHYLOGRAM; saved-figure-none.xml is its twin without a
// figure. Both have branch lengths, confidences, node events, branch colours
// and widths, domains and an alignment of 30 (8 tips; SRC_HUMAN's colour is
// rgb(192, 57, 43)).
//   ''            the pair's figure: an aligned phylogram, everything off
//   ?none=1       the twin: the viewer's own guesses
//   ?on=1         the twin + a figure naming everything ON, CLADOGRAM, CIRCULAR, Int. Labels on,
//                 Ext. Labels off, show.SHOW_NODE_NAMES= (empty: off), show.WIDTH_BRANCHES=true (ignored)
//   ?unrooted=1   the twin + layout=UNROOTED;displaytype=ALIGNED_PHYLOGRAM;labeldirection=HORIZONTAL and the
//                 domains off: unrooted, a plain phylogram, the labels upright
//   ?nolengths=1  the pair's figure on the tree stripped of its branch lengths: a cladogram, the one exception
//   ?config=1     the pair's figure + config layout 'circular', showMsa true, showDomainArchitectures true:
//                 the config wins where it speaks, the figure where it does not
//   ?switch=1     both trees in one list, the twin first, turned circular by hand; the second tree's figure
//                 wins over the geometry carried from the first (rectangular, aligned); the first comes
//                 back as it was left
(async function () {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const out = []; let failures = 0;
    const check = (l, ok, d) => { if (!ok) { failures++; }
        out.push((ok ? 'pass  ' : 'FAIL  ') + l + (d === undefined ? '' : '   [' + d + ']')); };
    const q = new URLSearchParams(location.search);
    const mode = ['none', 'on', 'unrooted', 'nolengths', 'config', 'switch'].find((m) => q.get(m) === '1') || 'figure';
    out.push('case ' + mode);
    const warnings = [];
    const warn = console.warn;
    console.warn = function () { warnings.push([...arguments].join(' ')); warn.apply(console, arguments); };
    try {
        const twin = mode === 'none' || mode === 'on' || mode === 'unrooted';
        const file = twin ? '../data/saved-figure-none.xml' : '../data/saved-figure.xml';
        let text = await (await fetch(file)).text();
        if (mode === 'nolengths') {
            text = text.replace(/<branch_length>[^<]*<\/branch_length>/g, '').replace(/\sbranch_length="[^"]*"/g, '');
            check('the stripped file names no branch length', text.indexOf('branch_length') < 0);
        }
        let trees = archaeopteryx.parseTrees(file, text);
        if (mode === 'switch') {
            const twinFile = '../data/saved-figure-none.xml';
            trees = archaeopteryx.parseTrees(twinFile, await (await fetch(twinFile)).text()).concat(trees);
        }
        const value = {
            on: 'v1;layout=CIRCULAR;displaytype=CLADOGRAM;show.WRITE_CONFIDENCE_VALUES=true;show.WRITE_EVENTS=true;'
                + 'show.USE_STYLE=true;show.WIDTH_BRANCHES=true;show.SHOW_DOMAIN_ARCHITECTURES=true;show.SHOW_MSA=TRUE;'
                + 'show.DISPLAY_INTERNAL_DATA=true;show.DISPLAY_EXTERNAL_DATA=false;show.SHOW_NODE_NAMES=',
            unrooted: 'v1;layout=UNROOTED;displaytype=ALIGNED_PHYLOGRAM;labeldirection=HORIZONTAL;show.SHOW_DOMAIN_ARCHITECTURES=false'
        }[mode];
        if (value) {
            trees[0].properties = (trees[0].properties || []).concat([{ref: 'aptx:figure', applies_to: 'phylogeny', datatype: 'xsd:string', value: value}]);
        }
        const figure = forester.readFigure(trees[0]);
        if (mode === 'none' || mode === 'switch') {
            check('the twin carries no figure', figure === null);
        } else {
            check('the reader sees the figure', !!figure && (mode === 'unrooted' || typeof figure.show.USE_STYLE === 'boolean'),
                JSON.stringify(figure));
        }
        const config = mode === 'config' ? {layout: 'circular', showMsa: true, showDomainArchitectures: true} : {};
        const viewer = archaeopteryx.launch('#p', trees, config);
        await viewer.ready; await sleep(1500);
        const vs = viewer.getViewState();
        const shows = (f) => vs.show.indexOf(f) >= 0;
        const cb = (id) => { const e = document.getElementById(id); return e ? e.checked : null; };
        const summary = JSON.stringify({layout: vs.layout, display: vs.display, msa: vs.msa, domains: vs.domains, show: vs.show});
        // update() animates, and a slow runner (CI, one case at a time) may still be moving the labels after the
        // wait above: read the visible labels' x until two readings 400 ms apart agree, then judge
        const labelXs = () => [...document.querySelectorAll('#p svg text.extlabel')]
            .map((t) => t.getBoundingClientRect()).filter((r) => r.width > 0).map((r) => r.left);
        const settledXs = async () => {
            let last = labelXs();
            for (let i = 0; i < 15; i++) {
                await sleep(400);
                const now = labelXs();
                if (now.length === last.length && now.every((x, k) => Math.abs(x - last[k]) < 0.01)) { return now; }
                last = now;
            }
            return last;
        };
        // a text's box starts at its first glyph's edge, which differs by about a pixel between first letters
        // on CI's Linux Chrome (964..965 there); the twin's unaligned labels differ by hundreds of pixels
        const labelsAligned = async () => {
            const xs = await settledXs();
            return {ok: xs.length > 1 && Math.max(...xs) - Math.min(...xs) < 3, xs: xs.map((x) => Math.round(x)).join(',')};
        };
        const fileColourOnScreen = () => [...document.querySelectorAll('#p svg *')].some((el) => {
            const cs = getComputedStyle(el); return cs.fill === 'rgb(192, 57, 43)' || cs.stroke === 'rgb(192, 57, 43)';
        });
        const msaDrawn = () => !!document.querySelector('#p svg g.aptx-msa');
        const domainsDrawn = () => !!document.querySelector('#p svg g.aptx-domains');
        if (mode === 'figure' || mode === 'config') {
            const wantLayout = mode === 'config' ? 'circular' : 'rectangular';
            check('the figure opens an aligned phylogram in its layout', vs.display === 'aligned' && vs.layout === wantLayout, summary);
            check('... Confidence, Node Events and Visual Styles off, as the figure says',
                !shows('confidence') && !shows('nodeEvents') && !shows('visualStyles'), summary);
            check('... the three checkboxes agree', cb('conf_cb') === false && cb('nevts_cb') === false && cb('vstyles_cb') === false,
                [cb('conf_cb'), cb('nevts_cb'), cb('vstyles_cb')].join(','));
            check('... the file\'s branch colour is nowhere on screen', !fileColourOnScreen());
            check('... Ext. Labels on and Int. Labels off, the viewer\'s own defaults (the figure does not name them)',
                shows('external') && !shows('internal'), summary);
            if (mode === 'figure') {
                check('... the alignment and the domains off, as the figure says', vs.msa === false && vs.domains === false
                    && cb('msa_cb') === false && cb('domains_cb') === false && !msaDrawn() && !domainsDrawn(), summary);
                const a = await labelsAligned();
                check('... the tip labels start on one x', a.ok, a.xs);
            } else {
                check('... but the config\'s showMsa and showDomainArchitectures win over the figure', vs.msa === true && vs.domains === true
                    && cb('msa_cb') === true && cb('domains_cb') === true, summary);
            }
        } else if (mode === 'none') {
            check('the twin opens a plain phylogram, rectangular', vs.display === 'phylogram' && vs.layout === 'rectangular', summary);
            check('... Node Events and Visual Styles on, Confidence off: the viewer\'s own guesses',
                shows('nodeEvents') && shows('visualStyles') && !shows('confidence'), summary);
            check('... the file\'s branch colour is on screen', fileColourOnScreen());
            check('... the alignment and the domains on and drawn', vs.msa === true && vs.domains === true
                && cb('msa_cb') === true && cb('domains_cb') === true && msaDrawn() && domainsDrawn(), summary);
            const a = await labelsAligned();
            check('... the tip labels do not start on one x', !a.ok, a.xs);
            check('... Ext. Labels on and Int. Labels off', shows('external') && !shows('internal'), summary);
        } else if (mode === 'on') {
            check('the figure opens a cladogram, circular', vs.display === 'cladogram' && vs.layout === 'circular', summary);
            check('... Confidence, Node Events and Visual Styles on', shows('confidence') && shows('nodeEvents') && shows('visualStyles')
                && cb('conf_cb') === true && cb('nevts_cb') === true && cb('vstyles_cb') === true, summary);
            check('... the alignment (show.SHOW_MSA=TRUE, case aside) and the domains on', vs.msa === true && vs.domains === true, summary);
            // the pair carries no internal node data, so no Int. Labels checkbox is offered: the
            // state is set all the same, as a config value would be, and a tree that has the data shows it
            check('... Int. Labels on and Ext. Labels off, as the figure says', shows('internal') && !shows('external')
                && cb('intl_cb') === null && cb('extl_cb') === false, summary + ' / ' + cb('intl_cb') + ',' + cb('extl_cb'));
            check('... show.SHOW_NODE_NAMES= (empty) reads as off', !shows('name') && cb('nn_cb') === false, summary);
        } else if (mode === 'unrooted') {
            check('layout=UNROOTED opens unrooted', vs.layout === 'unrooted', summary);
            check('... and ALIGNED_PHYLOGRAM there is a plain phylogram (unrooted cannot align)', vs.display === 'phylogram', summary);
            check('... labeldirection=HORIZONTAL turns the labels upright', vs.horizontalLabels === true, summary);
            check('... the domains off as the figure says, the rest the viewer\'s guesses', shows('nodeEvents') && shows('visualStyles')
                && !shows('confidence') && vs.msa === true && vs.domains === false, summary);
        } else if (mode === 'switch') {
            check('the twin opens first, a plain phylogram, rectangular', vs.display === 'phylogram' && vs.layout === 'rectangular'
                && vs.tree === undefined, summary);
            viewer.applyViewState(Object.assign({}, vs, {layout: 'circular'})); await sleep(1200);
            check('... turned circular by hand', viewer.getViewState().layout === 'circular', viewer.getViewState().layout);
            viewer.showTree(1); await sleep(1800);
            const v2 = viewer.getViewState();
            check('the second tree\'s figure wins over the geometry carried from the first: rectangular, aligned',
                v2.tree === 1 && v2.layout === 'rectangular' && v2.display === 'aligned', JSON.stringify(v2));
            check('... and its switches as saved', v2.msa === false && v2.domains === false && v2.show.indexOf('visualStyles') < 0
                && v2.show.indexOf('confidence') < 0, JSON.stringify(v2));
            viewer.showTree(0); await sleep(1500);
            const v0 = viewer.getViewState();
            check('back on the first tree, the circular layout it was left in', v0.tree === undefined && v0.layout === 'circular'
                && v0.display === 'phylogram', JSON.stringify(v0));
        } else {
            check('a tree without branch lengths opens as a cladogram whatever the figure says', vs.display === 'cladogram', summary);
            check('... the switches still read off the figure', !shows('confidence') && !shows('nodeEvents') && !shows('visualStyles')
                && vs.msa === false && vs.domains === false, summary);
        }
        check('no warning', warnings.length === 0, warnings.join(' | '));
    } catch (e) { check('no exception', false, e && (e.stack || e)); }
    window.__benchResult = {report: out.join('\n'), failures};
    window.__benchDone = true;
})();
</script>
