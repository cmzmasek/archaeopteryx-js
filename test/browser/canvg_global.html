<!doctype html>
<meta charset="utf-8"><title>aptx: the classic-script canvg build is what the viewer looks for</title>
<style>html,body{margin:0;height:100%}#phylogram1{position:absolute;inset:0}</style>
<script src="../../docs/lib/d3.v7.min.js"></script>
<script src="../../docs/lib/sax.js"></script>
<script src="../../docs/lib/phyloxml.js"></script>
<script src="../../docs/lib/forester.js"></script>
<script src="../../docs/lib/archaeopteryx.js"></script>
<!-- the point of this file: a PLAIN script tag, no module, no bridge -->
<script src="../../docs/lib/canvg.global.js"></script>
<div id="phylogram1"></div>
<script>
// BV-BRC's page bundles its scripts into one classic file and so could not
// carry the ES-module-only canvg 4; its 3.x viewer offered neither PNG nor
// Copy PNG (2026-10-08). docs/lib/canvg.global.js is the module build wrapped
// for a plain script tag, generated by test/make_canvg_global.js.
//
// What this checks is what the plain tag PROVIDES and what the viewer OFFERS
// on it: that a PNG saved through this build decodes, and that Copy PNG
// copies, is exports.html's job -- it loads the same file the same way.
//
//   (no query)    the global build alone: PNG in the Download menu, the Copy PNG button, the scale row
//   ?none=1       the control: with window.Canvg removed before launch, none of the three
(async function () {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const out = []; let failures = 0;
    const check = (l, ok, d) => { if (!ok) { failures++; }
        out.push((ok ? 'pass  ' : 'FAIL  ') + l + (d === undefined ? '' : '   [' + d + ']')); };
    const none = new URLSearchParams(location.search).get('none') === '1';
    try {
        check('the plain script tag defines window.Canvg with fromString',
            typeof window.Canvg === 'function' && typeof window.Canvg.fromString === 'function', typeof window.Canvg);
        if (none) { delete window.Canvg; }
        const file = '../../docs/data/woese-tree-of-life.xml';
        const text = await (await fetch(file)).text();
        const viewer = archaeopteryx.launch('#phylogram1', archaeopteryx.parseTrees(file, text), {});
        await viewer.ready;
        await sleep(1200);
        const menu = () => document.querySelector('.aptx-node-menu');
        const entry = (label) => menu() && [...menu().querySelectorAll('button')].find((b) => b.firstChild && b.firstChild.nodeValue === label);
        document.getElementById('dl_b').click(); await sleep(200);
        check('the Download menu opened', !!menu());
        const labels = menu() ? [...menu().querySelectorAll('button')].map((b) => b.firstChild && b.firstChild.nodeValue).filter(Boolean) : [];
        out.push('menu entries: ' + labels.join(', '));
        const copyBtn = document.getElementById('copy_png_b');
        const scaleRow = document.getElementById('dl_png2_b');
        if (none) {
            check('without window.Canvg, PNG is not in the menu', !entry('PNG'));
            check('... there is no Copy PNG button', !copyBtn);
            check('... and no PNG-scale row', !scaleRow);
            check('... while SVG still is offered', !!entry('SVG'));
        } else {
            check('PNG is in the Download menu', !!entry('PNG'));
            check('the Copy PNG button is offered (built at launch, so the build must load before launch())', !!copyBtn);
            check('the PNG-scale row is offered', !!scaleRow);
        }
    } catch (e) {
        check('harness ran', false, e && e.stack);
    }
    window.__benchResult = {report: out, failures: failures};
    window.__benchDone = true;
})();
</script>
