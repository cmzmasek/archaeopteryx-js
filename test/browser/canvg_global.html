<!doctype html>
<meta charset="utf-8"><title>aptx: the classic-script canvg build offers and makes a PNG</title>
<style>html,body{margin:0;height:100%}#phylogram1{position:absolute;inset:0}</style>
<script src="../../docs/lib/d3.v7.min.js"></script>
<script src="../../docs/lib/sax.js"></script>
<script src="../../docs/lib/jspdf.umd.min.js"></script>
<script src="../../docs/lib/svg2pdf.umd.min.js"></script>
<script src="../../docs/lib/phyloxml.js"></script>
<script src="../../docs/lib/forester.js"></script>
<script src="../../docs/lib/archaeopteryx.js"></script>
<!-- the point of this file: a PLAIN script tag, no module, no bridge -->
<script src="../../docs/lib/canvg.global.js"></script>
<div id="phylogram1"></div>
<script>
// BV-BRC's page bundles its scripts into one classic file and so could not
// carry the ES-module-only canvg 4; its 3.x viewer offered neither PNG nor
// Copy PNG (2026-10-08). docs/lib/canvg.global.js is the module build wrapped
// for a plain script tag, generated by test/make_canvg_global.js. This drives
// the Download menu the way a user does and reads the PNG back.
//
//   (no query)    the global build alone: PNG offered, saved, decodable; Copy PNG offered and copied
//   ?none=1       the control: with window.Canvg removed, PNG and Copy PNG are NOT offered
(async function () {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const out = []; let failures = 0;
    const check = (l, ok, d) => { if (!ok) { failures++; }
        out.push((ok ? 'pass  ' : 'FAIL  ') + l + (d === undefined ? '' : '   [' + d + ']')); };
    const q = new URLSearchParams(location.search);
    const none = q.get('none') === '1';
    try {
        check('the classic build defines window.Canvg with fromString', typeof window.Canvg === 'function' && typeof window.Canvg.fromString === 'function',
            typeof window.Canvg);
        if (none) { delete window.Canvg; }
        // files, caught instead of saved; the clipboard, caught instead of written
        const files = []; const blobs = new Map();
        const create = URL.createObjectURL.bind(URL);
        URL.createObjectURL = (b) => { const u = create(b); blobs.set(u, b); return u; };
        HTMLAnchorElement.prototype.click = function () { if (this.download) { files.push({name: this.download, blob: blobs.get(this.href)}); } };
        let copiedItems = null;
        Object.defineProperty(navigator, 'clipboard', {configurable: true, value: {writeText: () => Promise.resolve(),
            write: async (items) => { for (const it of items) { await it.getType('image/png'); } copiedItems = items; }}});

        const file = '../../docs/data/woese-tree-of-life.xml';
        const text = await (await fetch(file)).text();
        const viewer = archaeopteryx.launch('#phylogram1', archaeopteryx.parseTrees(file, text), {});
        await viewer.ready;
        await sleep(1200);
        const menu = () => document.querySelector('.aptx-node-menu');
        const entry = (label) => menu() && [...menu().querySelectorAll('button')].find((b) => b.firstChild && b.firstChild.nodeValue === label);
        document.getElementById('dl_b').click(); await sleep(200);
        check('the Download menu opened', !!menu());
        const labels = menu() ? [...menu().querySelectorAll('button')].map((b) => b.firstChild && b.firstChild.nodeValue).filter(Boolean) : [];
        out.push('menu entries: ' + labels.join(', '));
        if (none) {
            check('without window.Canvg, PNG is not offered', !entry('PNG'));
            check('... nor the Copy PNG button', !document.getElementById('copy_png_b'));
            check('... while SVG and PDF are', !!entry('SVG') && !!entry('PDF'));
        } else {
            check('PNG is offered', !!entry('PNG'));
            // Copy PNG is a button of the panel's Download section, built at launch
            check('the Copy PNG button is offered', !!document.getElementById('copy_png_b'));
            const before = files.length;
            entry('PNG').click();
            const t0 = Date.now();
            while (files.length <= before && Date.now() - t0 < 20000) { await sleep(50); }
            const f = files[files.length - 1];
            check('a PNG file was produced', files.length > before && f && /\.png$/i.test(f.name) && f.blob && f.blob.type === 'image/png',
                f && (f.name + ' ' + (f.blob && f.blob.type)));
            if (f && f.blob) {
                const url = URL.createObjectURL(f.blob);
                const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });
                check('... that decodes to an image with size', !!img && img.naturalWidth > 100 && img.naturalHeight > 100,
                    img && (img.naturalWidth + 'x' + img.naturalHeight));
                // not blank: some pixel is not the background
                if (img) {
                    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
                    const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
                    const d = ctx.getImageData(0, 0, c.width, c.height).data;
                    let ink = 0;
                    for (let i = 0; i < d.length; i += 4 * 97) { if (d[i] < 200 || d[i + 1] < 200 || d[i + 2] < 200) { ink++; } }
                    check('... and is not blank', ink > 20, ink + ' dark samples');
                }
            }
            if (menu()) { document.body.click(); await sleep(150); }
            document.getElementById('copy_png_b').click();
            const t1 = Date.now();
            while (!copiedItems && Date.now() - t1 < 20000) { await sleep(50); }
            check('Copy PNG put a PNG on the clipboard', !!copiedItems && copiedItems.length === 1
                && copiedItems[0].types.indexOf('image/png') >= 0, copiedItems && copiedItems[0].types.join(','));
        }
    } catch (e) {
        check('harness ran', false, e && e.stack);
    }
    window.__benchResult = {report: out, failures: failures};
    window.__benchDone = true;
})();
</script>
