<!doctype html>
<meta charset="utf-8"><title>time axis in the circular layout, and Time | Div on a BEAST clock tree</title>
<style>html,body{margin:0;height:100%}#p{position:absolute;inset:0}</style>
<script src="../../docs/lib/d3.v7.min.js"></script>
<script src="../../docs/lib/sax.js"></script>
<script src="../../docs/lib/phyloxml.js"></script>
<script src="../../docs/lib/forester.js"></script>
<script src="../../docs/lib/archaeopteryx.js"></script>
<div id="p"></div>
<script>
// Christian, on a BEAST MCC tree (HA_continuous_MCC.tre): no Time | Div switch,
// and no age bars in the circular layout. A BEAST clock-model tree states its
// branch lengths in time and a clock rate per branch, so its divergence is
// length x rate; and the time axis now draws in circular: bars along each
// node's spoke, a ruler along the gap between the last tip and the first.
//
// The tree is built here, so the harness needs nothing from the git-excluded
// test_trees/: 16 tips sampled in 2018-2020, heights with 95% HPD intervals on
// every internal node, and clock rates that VARY, so the two views differ.
(async function () {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const settle = () => sleep(2200);
    const byId = (id) => document.getElementById(id);
    const out = []; let failures = 0;
    const check = (l, ok, d) => { if (!ok) { failures++; }
        out.push((ok ? 'pass  ' : 'FAIL  ') + l + (d === undefined ? '' : '   [' + d + ']')); };
    const tipPos = (g) => { const m = /translate\(([-\d.e]+)[ ,]+([-\d.e]+)\)/.exec(g.getAttribute('transform') || '');
        return m ? [+m[1], +m[2]] : null; };
    const ang = (p) => Math.atan2(p[1], p[0]);
    const endsOf = (l) => [[+l.getAttribute('x1'), +l.getAttribute('y1')], [+l.getAttribute('x2'), +l.getAttribute('y2')]];
    // A mark read along a spoke at angle a: each end's SIGNED distance from
    // the centre in the spoke's direction (negative is the far side of the
    // centre), and how far it strays sideways from the spoke's line.
    const along = (l, a) => { const u = [Math.cos(a), Math.sin(a)];
        return {s: endsOf(l).map((e) => e[0] * u[0] + e[1] * u[1]),
            side: endsOf(l).map((e) => e[0] * u[1] - e[1] * u[0])}; };
    try {
        if (/[?&]fossil=1/.test(location.search)) {
            await fossilPastTheCentre();
            window.__benchResult = {report: out, failures: failures};
            window.__benchDone = true;
            return;
        }
        const LEVEL = [8, 6, 4.5, 3.2];     // internal heights by depth; tips at 0-2
        let k = 0, tip = 0;
        const rate = () => (0.002 + 0.004 * (k++ % 4)).toFixed(3);
        const build = (depth, parentH) => {
            if (depth === 4) {
                const h = tip % 3;
                const name = 'T' + tip++ + '_' + (2020 - h);
                return name + '[&rate=' + rate() + ',height=' + h + ']:' + (parentH - h);
            }
            const h = LEVEL[depth];
            const kids = build(depth + 1, h) + ',' + build(depth + 1, h);
            // the LAST node of the deepest level states an interval a fraction
            // of a pixel long (0.003 years): it is drawn at the 1 px floor
            const narrow = depth === 3 && tip === 16;
            const ann = 'height=' + h + ',height_95%_HPD={' + (narrow ? (h - 0.001).toFixed(3) + ',' + (h + 0.002).toFixed(3)
                : (h * 0.9).toFixed(2) + ',' + (h * 1.15).toFixed(2)) + '}';
            return depth === 0 ? '(' + kids + ')[&' + ann + ']'
                : '(' + kids + ')[&rate=' + rate() + ',' + ann + ']:' + (parentH - h);
        };
        const nex = '#NEXUS\nBegin trees;\ntree CLOCK = [&R] ' + build(0, 0) + ';\nEnd;\n';
        const trees = archaeopteryx.parseTrees('clock.nex', nex);
        const tree = Array.isArray(trees) ? trees[0] : trees;
        const viewer = archaeopteryx.launch('#p', trees, {});
        await viewer.ready;
        await settle();

        const group = document.querySelector('#p .branch_scale_g');
        check('the Time | Div switch is offered', !!group && getComputedStyle(group).display !== 'none'
            && group.offsetParent !== null);
        check('it opens on Time', byId('branch_scale_time_b') && byId('branch_scale_time_b').checked);
        check('the time axis is on', byId('timeaxis_cb') && byId('timeaxis_cb').checked);

        const bars = () => [...document.querySelectorAll('#p .aptx-time .aptx-age-bar')];
        const internal = [];
        forester.preOrderTraversalAll(tree, (d) => { if (d.children && d.date && d.date.minimum !== d.date.maximum) { internal.push(d); } });
        check('rectangular: one age bar per dated internal node', bars().length === internal.length && internal.length === 15,
            bars().length + ' bars, ' + internal.length + ' nodes');

        byId('layout_circ_b').click(); await settle();
        const bs = bars();
        check('circular: one age bar per dated internal node', bs.length === 15, bs.length + ' bars');
        check('circular: every bar is a segment, not a rectangle', bs.every((b) => b.tagName === 'line'));
        // each bar lies along its OWN node's spoke and spans the node's age:
        // the node sits on the segment, between its ends. Only tips are drawn
        // as g.node, so an internal node's point is placed the way the layout
        // places every node -- radius linear in depth (y), angle linear in the
        // cross-axis position (x) -- with both scales read off the drawn tips.
        const tipsDrawn = [...document.querySelectorAll('#p g.node')].filter((g) => g.__data__ && !g.__data__.children)
            .map((g) => ({d: g.__data__, p: tipPos(g)})).filter((t) => t.p).sort((a, b) => a.d.x - b.d.x);
        const t0 = tipsDrawn[0], t1 = tipsDrawn[1];
        let dA = ang(t1.p) - ang(t0.p);
        dA = Math.atan2(Math.sin(dA), Math.cos(dA));
        const perX = dA / (t1.d.x - t0.d.x);
        const perY = Math.hypot(...t0.p) / t0.d.y;
        const polarOf = (d) => ({a: ang(t0.p) + (d.x - t0.d.x) * perX, r: d.y * perY});
        const pointOf = (d) => { const q = polarOf(d); return [q.r * Math.cos(q.a), q.r * Math.sin(q.a)]; };
        let off = [], spans = [];
        bs.forEach((b) => {
            const q = polarOf(b.__data__);
            const m = along(b, q.a);
            const side = Math.max(...m.side.map(Math.abs));
            if (side > 0.5) { off.push(side.toFixed(2)); }
            if (!(q.r >= Math.min(...m.s) - 0.5 && q.r <= Math.max(...m.s) + 0.5)) {
                spans.push(q.r.toFixed(1) + ' not in ' + Math.min(...m.s).toFixed(1) + ' to ' + Math.max(...m.s).toFixed(1));
            }
        });
        check('circular: the tips confirm the placement', tipsDrawn.every((t) => { const q = pointOf(t.d);
            return Math.hypot(q[0] - t.p[0], q[1] - t.p[1]) < 0.5; }));
        check('circular: every bar lies on its node\'s spoke', off.length === 0, off.slice(0, 5).join(' '));
        check('circular: every bar spans its node', spans.length === 0, spans.slice(0, 3).join('; '));

        // The root sits AT the centre and its interval reaches back past its
        // own estimate, so its bar runs on through the centre onto the far
        // side, as the desktop's does. Where each end belongs is worked out
        // from the root's dates and a drawn tip, not from the bar.
        const rootBar = bs.slice().sort((p, q) => p.__data__.y - q.__data__.y)[0];
        const rd = rootBar.__data__.date;
        check('circular: the root sits at the centre, its interval on both sides of its date',
            polarOf(rootBar.__data__).r === 0 && rd.minimum < rd.value && rd.value < rd.maximum,
            'radius ' + polarOf(rootBar.__data__).r + ', ' + rd.minimum + ' < ' + rd.value + ' < ' + rd.maximum);
        const perYear = Math.hypot(...t0.p) / (t0.d.date.value - rd.value);
        const older = -(rd.value - rd.minimum) * perYear, younger = (rd.maximum - rd.value) * perYear;
        const rs = along(rootBar, polarOf(rootBar.__data__).a).s.slice().sort((p, q) => p - q);
        check('circular: the root\'s bar runs through the centre', rs[0] < -0.5 && rs[1] > 0.5,
            rs.map((v) => v.toFixed(1)).join(' to '));
        // An interval shorter than a pixel is drawn one pixel long, from its
        // INNER end outward -- [inner, inner + 1], the desktop's rule and the
        // rectangular bar's. Centred on the interval, it would start half a
        // pixel further in.
        const narrowBars = bs.filter((b) => (b.__data__.date.maximum - b.__data__.date.minimum) < 0.01);
        check('circular: one bar states an interval under a pixel long', narrowBars.length === 1
            && (narrowBars[0].__data__.date.maximum - narrowBars[0].__data__.date.minimum) * perYear < 0.5,
            narrowBars.length + ' such bars' + (narrowBars.length ? ', ' + ((narrowBars[0].__data__.date.maximum
                - narrowBars[0].__data__.date.minimum) * perYear).toFixed(3) + ' px' : ''));
        if (narrowBars.length === 1) {
            const nd = narrowBars[0].__data__;
            const q = polarOf(nd);
            const ns = along(narrowBars[0], q.a).s.slice().sort((p, q2) => p - q2);
            const innerWanted = q.r - (nd.date.value - nd.date.minimum) * perYear;
            check('circular: it is drawn one pixel long, from its inner end outward',
                Math.abs((ns[1] - ns[0]) - 1) < 0.01 && Math.abs(ns[0] - innerWanted) < 0.05,
                'drawn ' + ns[0].toFixed(3) + ' to ' + ns[1].toFixed(3) + ', the inner end belongs at ' + innerWanted.toFixed(3));
        }
        check('circular: its far end is as far past the centre as the interval is older than the root',
            older < -20 && Math.abs(rs[0] - older) < 0.5 && Math.abs(rs[1] - younger) < 0.5,
            'drawn ' + rs.map((v) => v.toFixed(1)).join(' to ') + ', the dates say ' + older.toFixed(1) + ' to ' + younger.toFixed(1));

        // the ruler: in the gap no branch crosses, with year labels
        const ruler = document.querySelector('#p .aptx-time-ruler');
        check('circular: the ruler is drawn', !!ruler);
        if (ruler) {
            const l = ruler.querySelector('line');
            const rulerAng = ang([+l.getAttribute('x2'), +l.getAttribute('y2')]);
            const tipAngles = tipsDrawn.map((t) => ang(t.p));
            const gapMin = Math.min(...tipAngles.map((t) => { let x = Math.abs(t - rulerAng) % (2 * Math.PI); return Math.min(x, 2 * Math.PI - x); }));
            const step = 2 * Math.PI / tipAngles.length;
            check('circular: 16 tips measured', tipAngles.length === 16, tipAngles.length);
            // and in THE gap: between the last tip and the first, in tip order.
            // Clearance alone is not enough -- halfway round, the ruler falls
            // between two neighbouring tips and clears both just as well.
            const dir = Math.sign(perX);
            const rel = (a) => { const x = (dir * (a - ang(t0.p))) % (2 * Math.PI); return x < 0 ? x + 2 * Math.PI : x; };
            const lastRel = rel(ang(tipsDrawn[tipsDrawn.length - 1].p));
            check('circular: the ruler lies in the gap, clear of every tip', gapMin > 0.4 * step && rel(rulerAng) > lastRel,
                (gapMin / step).toFixed(2) + ' tip spacings from the nearest tip; at ' + rel(rulerAng).toFixed(3)
                + ' rad past the first tip, the last at ' + lastRel.toFixed(3));
            const years = [...ruler.querySelectorAll('text')].map((t) => +t.textContent);
            check('circular: year labels, within the tree\'s span', years.length >= 2
                && years.every((y) => y >= 2010 && y <= 2021), years.join(','));
        }
        check('circular: no strip under the tree', !document.querySelector('#p g.aptx-time-axis'));

        byId('timegrid_cb').click(); await settle();
        const rings = document.querySelectorAll('#p g.aptx-timegrid circle').length;
        check('circular: Time Grid draws rings', rings >= 1, rings + ' rings');
        byId('timegrid_cb').click(); await settle();

        byId('branch_scale_div_b').click(); await settle();
        check('Div: the switch took', byId('branch_scale_div_b').checked);
        check('Div: no age bars (calendar years do not measure substitutions)', bars().length === 0, bars().length);
        byId('branch_scale_time_b').click(); await settle();
        check('back to Time: the bars return', bars().length === 15, bars().length);

        byId('layout_unrooted_b').click(); await settle();
        check('unrooted: no time axis', bars().length === 0 && !document.querySelector('#p .aptx-time-ruler'));
    } catch (e) {
        check('harness ran', false, e && e.stack);
    }
    window.__benchResult = {report: out, failures: failures};
    window.__benchDone = true;

    // ?fossil=1 -- a fossil's range on a geologic tree, reaching back past the
    // root: "Reacher" is 8 My old under a root of 10, first seen 13 My ago. Its
    // bar runs from 3 My on its own side, through the centre, to 3 My on the
    // far side, and carries its end caps with it.
    async function fossilPastTheCentre() {
        const clade = (name, bl, v, lo, hi, kids) => '<clade><name>' + name + '</name><branch_length>' + bl
            + '</branch_length><date unit="mya"><value>' + v + '</value>'
            + (lo === null ? '' : '<minimum>' + lo + '</minimum><maximum>' + hi + '</maximum>') + '</date>'
            + (kids || '') + '</clade>';
        const xml = '<?xml version="1.0" encoding="UTF-8"?><phyloxml xmlns="http://www.phyloxml.org">'
            + '<phylogeny rooted="true" branch_length_unit="My">'
            + clade('Root', 0, 10, null, null,
                clade('Inner', 4, 6, null, null,
                    clade('Living', 6, 0, null, null) + clade('Ranged', 4, 2, 1, 4)
                    + clade('Other', 5, 1, null, null))
                + clade('Reacher', 2, 8, 7, 13))
            + '</phylogeny></phyloxml>';
        const trees = archaeopteryx.parseTrees('fossil.xml', xml);
        const viewer = archaeopteryx.launch('#p', trees, {});
        await viewer.ready;
        await settle();
        check('fossil: the time axis is on', byId('timeaxis_cb') && byId('timeaxis_cb').checked);
        byId('layout_circ_b').click(); await settle();
        const tips = {};
        [...document.querySelectorAll('#p g.node')].filter((g) => g.__data__ && !g.__data__.children)
            .forEach((g) => { tips[g.__data__.name] = {d: g.__data__, p: tipPos(g)}; });
        check('fossil: the tips are drawn', !!(tips.Living && tips.Reacher && tips.Ranged && tips.Living.p && tips.Reacher.p),
            Object.keys(tips).join(','));
        const perMy = Math.hypot(...tips.Living.p) / 10;      // Living is 10 My from the root
        check('fossil: Reacher sits 2 My out', Math.abs(Math.hypot(...tips.Reacher.p) - 2 * perMy) < 0.5,
            Math.hypot(...tips.Reacher.p).toFixed(1) + ' px, 2 My is ' + (2 * perMy).toFixed(1));
        const mine = (cls, name) => [...document.querySelectorAll('#p .aptx-time .' + cls)].filter((e) => e.__data__ && e.__data__.name === name);
        const a = ang(tips.Reacher.p);
        const bar = mine('aptx-fossil-bar', 'Reacher');
        check('fossil: Reacher has one range bar', bar.length === 1, bar.length);
        const bs = along(bar[0], a);
        const s = bs.s.slice().sort((p, q) => p - q);
        check('fossil: the bar lies on Reacher\'s line', Math.max(...bs.side.map(Math.abs)) < 0.5,
            Math.max(...bs.side.map(Math.abs)).toFixed(2));
        check('fossil: it runs from 3 My on its own side to 3 My past the centre',
            perMy * 3 > 20 && Math.abs(s[0] + 3 * perMy) < 0.5 && Math.abs(s[1] - 3 * perMy) < 0.5,
            'drawn ' + s.map((v) => v.toFixed(1)).join(' to ') + ', the dates say ' + (-3 * perMy).toFixed(1) + ' to ' + (3 * perMy).toFixed(1));
        // the caps: one at each end of the bar, across it, 4 px either side
        const caps = mine('aptx-fossil-cap', 'Reacher').map((c) => along(c, a));
        check('fossil: Reacher has two end caps', caps.length === 2, caps.length);
        const at = caps.map((c) => (c.s[0] + c.s[1]) / 2).sort((p, q) => p - q);
        check('fossil: a cap at each end of the bar, the far one included', caps.length === 2
            && Math.abs(at[0] - s[0]) < 0.5 && Math.abs(at[1] - s[1]) < 0.5,
            'caps at ' + at.map((v) => v.toFixed(1)).join(' and ') + ', the bar ends at ' + s.map((v) => v.toFixed(1)).join(' and '));
        check('fossil: each cap crosses the line squarely, 4 px either side', caps.every((c) =>
            Math.abs(c.s[0] - c.s[1]) < 0.5 && Math.abs(c.side[0] + c.side[1]) < 0.5
            && Math.abs(Math.abs(c.side[0] - c.side[1]) - 8) < 0.5),
            caps.map((c) => Math.abs(c.side[0] - c.side[1]).toFixed(1) + ' px wide').join(', '));
        // and a range that stays on its own side is drawn as it was
        const ranged = mine('aptx-fossil-bar', 'Ranged');
        const rs = ranged.length === 1 ? along(ranged[0], ang(tips.Ranged.p)).s.slice().sort((p, q) => p - q) : [NaN, NaN];
        check('fossil: a range short of the centre stays on its own side', Math.abs(rs[0] - 6 * perMy) < 0.5
            && Math.abs(rs[1] - 9 * perMy) < 0.5, rs.map((v) => v.toFixed(1)).join(' to ') + ', the dates say '
            + (6 * perMy).toFixed(1) + ' to ' + (9 * perMy).toFixed(1));
    }
})();
</script>
