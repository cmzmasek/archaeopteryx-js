<!doctype html>
<meta charset="utf-8"><title>aptx: does every download write what it says?</title>
<style>html,body{margin:0;height:100%}#phylogram1{position:absolute;inset:0}</style>
<script src="../../docs/lib/d3.v7.min.js"></script>
<script src="../../docs/lib/sax.js"></script>
<script src="../../docs/lib/jspdf.umd.min.js"></script>
<script src="../../docs/lib/svg2pdf.umd.min.js"></script>
<script src="../../docs/lib/phyloxml.js"></script>
<script src="../../docs/lib/forester.js"></script>
<script src="../../docs/lib/archaeopteryx.js"></script>
<!-- the classic-script canvg build, as the demo pages load it and as a bundling site would -->
<script src="../../docs/lib/canvg.global.js"></script>
<div id="phylogram1"></div>
<script type="module">
// Every download, driven the way a user drives it -- the Download button, the
// menu it opens, the section's choices -- with the file caught on its way to
// the disk and then READ: parsed back, measured, decoded. Nothing here asks
// the code what it meant to write.
//
//   ?tree=<file>     the tree (default flu_h5: 354 tips, far too many for the
//                    window, so "as shown" and "full size" must differ)
//   ?layout=circular|unrooted   switch the layout first
//   &seqs=1          the Nexus entry's promise, on an aligned and a ragged tree
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const out = []; let failures = 0;
const check = (l, ok, d) => { if (!ok) { failures++; }
    out.push((ok ? 'pass  ' : 'FAIL  ') + l + (d === undefined ? '' : '   [' + d + ']')); };
const finish = () => { window.__benchResult = {report: out, failures: failures}; window.__benchDone = true; };
const q = new URLSearchParams(location.search);

// ---- the files, caught instead of saved --------------------------------
const files = [];
const blobs = new Map();
const create = URL.createObjectURL.bind(URL);
URL.createObjectURL = (b) => { const u = create(b); blobs.set(u, b); return u; };
HTMLAnchorElement.prototype.click = function () {
    if (this.download) { files.push({name: this.download, blob: blobs.get(this.href)}); }
};
// jsPDF saves through its own bundled saver, on an anchor it never attaches
window.jspdf.jsPDF.API.save = function (name) {
    files.push({name: name, blob: this.output('blob'), pdf: this});
};
const nextFile = async (before, ms) => {
    const t0 = Date.now();
    while (files.length <= before && Date.now() - t0 < (ms || 20000)) { await sleep(50); }
    return files.length > before ? files[files.length - 1] : null;
};
let copied = null;
let copiedItems = null;
Object.defineProperty(navigator, 'clipboard', {configurable: true,
    value: {writeText: (t) => { copied = t; return Promise.resolve(); },
        // a real clipboard waits on a promise-valued item before it resolves
        write: async (items) => { for (const it of items) { await it.getType('image/png'); }
            copiedItems = items; }}});

const byId = (id) => document.getElementById(id);
const menu = () => document.querySelector('.aptx-node-menu');
const menuEntry = (label) => menu() && [...menu().querySelectorAll('button')]
    .find((b) => b.firstChild && b.firstChild.nodeValue === label);
async function download(label) {
    if (!menu()) { byId('dl_b').click(); await sleep(150); }
    const b = menuEntry(label);
    if (!b) { return null; }
    const before = files.length;
    b.click();
    return nextFile(before);
}
const svgOf = async (f) => new DOMParser().parseFromString(await f.blob.text(), 'image/svg+xml').documentElement;
// the same proportions, RELATIVELY: a tall page's ratio is ~0.05, and an
// absolute tolerance of 0.01 let jsPDF's silent clamp of 17,223 pt to 14,400
// -- the bottom sixth of the tree cut off -- pass as the same shape
const sameShape = (w1, h1, w2, h2) => Math.abs(((w1 / h1) / (w2 / h2)) - 1) < 0.01;
const tipNames = (root) => forester.getAllExternalNodes(root).map((n) => n.name).filter(Boolean);
// the tip names a graphic actually draws: a tip's label is a text.extlabel,
// and one the auto-hide rules refused is not drawn at all (or drawn empty)
const tipLabelsIn = (svg) => [...svg.querySelectorAll('text.extlabel')]
    .filter((t) => t.textContent.trim() !== '').length;

// What the tips carry comes back from a saved phyloXML file: until phyloxml
// 1.1.5 a file lost every domain architecture, annotation and URI it had been
// read with. apaf.xml has 202 domains; the default tree has none, so the
// check there only says that nothing appears from nowhere.
const carried = (t) => { const c = {domains: 0, annotations: 0, uris: 0, locations: 0, sequences: 0};
    forester.preOrderTraversalAll(t, (d) => {
        (d.sequences || []).forEach((sq) => {
            c.sequences += 1;
            c.domains += sq.domain_architecture && sq.domain_architecture.domains ? sq.domain_architecture.domains.length : 0;
            c.annotations += (sq.annotations || []).length;
            c.uris += (sq.uris || []).length;
            c.locations += sq.location ? 1 : 0;
        });
        (d.taxonomies || []).forEach((tx) => { c.uris += (tx.uris || []).length; });
    });
    return c; };
function checkCarried(tree, px) {
    const had = carried(tree);
    const kept = carried(px);
    check('the phyloXML file keeps every sequence, domain, annotation, URI and location', JSON.stringify(had) === JSON.stringify(kept),
        JSON.stringify(had) + ' -> ' + JSON.stringify(kept));
    return had;
}
async function keptFile(file, what, enough) {
    const trees = await launch(file, await (await fetch(file)).text());
    const tree = Array.isArray(trees) ? trees[0] : trees;
    const f = await download('phyloXML');
    const px = f ? phyloXml.parse(await f.blob.text(), {trim: true, normalize: true})[0] : null;
    check(what + ': the phyloXML download is written', !!px);
    if (px) {
        const had = checkCarried(tree, px);
        check('... and the fixture has something to lose', enough(had), JSON.stringify(had));
        // and the regions themselves, read from the SAVED file, are the same
        const regionsOf = (t) => { const out = []; forester.preOrderTraversalAll(t, (d) => {
            if (!d.children) { const r = forester.geneRegionOf(d);
                out.push(r ? r.genes.map((g) => [g.symbol, g.start, g.end, g.strand, g.refs.join(','), g.accession && g.accession.value]) : null); } });
            return JSON.stringify(out); };
        check('... and the saved file gives back the same genome regions', regionsOf(tree) === regionsOf(px));
    }
}

async function launch(file, text) {
    const trees = archaeopteryx.parseTrees(file, text);
    const viewer = archaeopteryx.launch('#phylogram1', trees);
    window.__aptxViewer = viewer;
    await viewer.ready;
    await sleep(1800);
    return trees;
}

// On the page a shape's paint is an inline style (an attribute gives way to any rule of the page). A FILE says it
// as attributes again (2026-10-10): of five programs that are not a browser, one (MuPDF) drew the faint lines of
// an exported svg at full strength, reading a line's colour from a style and not its opacity. And it says its
// colours as SVG 1.1 has them: the same program drew "transparent" and a colour with an alpha as black -- a slab
// over a heat map (the surface that listens to the pointer), one over each row of a legend, a solid bar for a
// node's translucent age interval.
const FILE_PAINT = ['fill', 'fill-opacity', 'fill-rule', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray',
    'stroke-dashoffset', 'stroke-linecap', 'stroke-linejoin', 'stroke-miterlimit', 'text-anchor', 'dominant-baseline',
    'shape-rendering', 'vector-effect', 'stop-color', 'stop-opacity', 'opacity'];
const FILE_ALPHA = {'fill': 'fill-opacity', 'stroke': 'stroke-opacity', 'stop-color': 'stop-opacity'};
const allOf = (svg) => [svg, ...svg.querySelectorAll('*')];
const paintInStyle = (svg) => { const found = [];
    for (const e of allOf(svg)) { for (const n of FILE_PAINT) { if (e.style && e.style.getPropertyValue(n) !== '') { found.push(e.tagName + ' ' + n + ': ' + e.style.getPropertyValue(n)); } } }
    return found; };
const paintAsAttribute = (svg) => allOf(svg).reduce((n, e) => n + FILE_PAINT.filter((p) => e.hasAttribute(p)).length, 0);
// a paint SVG 1.1 does not have: "transparent", or a colour with an alpha
const notOfSvg11 = (svg) => { const found = [];
    for (const e of allOf(svg)) { for (const n of Object.keys(FILE_ALPHA)) { const v = e.getAttribute(n) || (e.style ? e.style.getPropertyValue(n) : '');
        const c = v ? d3.color(v) : null; if (c && c.opacity < 1) { found.push(e.tagName + ' ' + n + '=' + v); } } }
    return found; };
// The svg file of what is on screen ("As shown"), against the window it was made from: shape by shape.
function fileAgainstWindow(name, live, shown) {
    const inWindow = allOf(live).reduce((n, e) => n + FILE_PAINT.filter((p) => e.style.getPropertyValue(p) !== '').length, 0);
    check(name + ': the window states its shapes\' paint as styles', inWindow > 100 && paintAsAttribute(live) === live.querySelectorAll('[vector-effect]').length,
        inWindow + ' as a style, ' + paintAsAttribute(live) + ' as an attribute');
    const styled = paintInStyle(shown);
    check(name + ': no shape of the file states its paint in a style', styled.length === 0, styled.length + ': ' + styled.slice(0, 3).join(' | '));
    check(name + ': ... nor is a style attribute left empty', allOf(shown).every((e) => e.getAttribute('style') !== ''));
    // ...and says what the window's shape says (the page's ground, which a file has white, is the one colour
    // that may differ). All of the svg: the tree, the strips under it, the legend cards; less what a file leaves out.
    const paper = (svg) => svg.querySelector('rect.basebackground');
    const colour = (v) => { const c = v ? d3.color(v) : null; return c ? c.formatRgb() : v; };
    const groundWindow = colour(paper(live).style.getPropertyValue('fill')); const groundFile = colour(paper(shown).getAttribute('fill'));
    const a = [...live.querySelectorAll('*')].filter((e) => !e.closest('.aptx-overview, .aptx-hoverglow, circle.foundHalo'));
    const b = [...shown.querySelectorAll('*')];
    const holdsShapes = (e) => [...e.children].some((c) => c.localName !== 'title' && c.localName !== 'desc');
    const differ = []; const worked = new Set(); let stated = 0; let clear = 0; let sheer = 0;
    for (let i = 0; i < Math.min(a.length, b.length); ++i) {
        for (const n of FILE_PAINT) {
            const want = a[i].style.getPropertyValue(n).replace(/^url\("([^"]*)"\)$/, 'url($1)'); const got = b[i].getAttribute(n) || '';
            if (want !== '') { ++stated; }
            if (worked.has(i + ' ' + n)) { continue; }                 // an opacity the file worked out of a colour's alpha: judged there
            const c = FILE_ALPHA[n] && want ? d3.color(want) : null;
            if (c && c.opacity < 1 && !holdsShapes(a[i])) {
                // not SVG 1.1's: no paint at all is "none"; an alpha goes into the paint's opacity, times what the shape
                // has of it in the window, stated or handed down
                worked.add(i + ' ' + FILE_ALPHA[n]);
                if (c.opacity === 0 && n !== 'stop-color') { ++clear;
                    if (got !== 'none') { differ.push(a[i].tagName + ' ' + n + ': "' + want + '" in the window, "' + got + '" in the file'); }
                    continue; }
                ++sheer;
                const whole = parseFloat(getComputedStyle(a[i]).getPropertyValue(FILE_ALPHA[n])); const has = parseFloat(b[i].getAttribute(FILE_ALPHA[n]));
                if (colour(got) !== c.copy({opacity: 1}).formatRgb() || !(Math.abs(has - (c.opacity * whole)) < 0.001)) {
                    differ.push(a[i].tagName + ' ' + n + ': "' + want + '" at ' + whole + ' in the window, "' + got + '" at ' + b[i].getAttribute(FILE_ALPHA[n]) + ' in the file'); }
                continue;
            }
            if (want === got || colour(want) === colour(got) || (colour(want) === groundWindow && colour(got) === groundFile)) { continue; }
            differ.push(a[i].tagName + ' ' + n + ': "' + want + '" in the window, "' + got + '" in the file');
        }
    }
    check(name + ': the file has the window\'s shapes, one for one', a.length === b.length && a.length > 20 && a.every((e, i) => e.tagName === b[i].tagName),
        a.length + ' in the window, ' + b.length + ' in the file');
    const links = b.filter((e) => FILE_PAINT.some((n) => /url\(/.test(e.getAttribute(n) || '')));
    out.push(name + ': ' + links.length + ' paints of the file are a gradient of its own; in the window ' + clear + ' are "transparent" and ' + sheer + ' a colour with an alpha');
    check(name + ': ... a paint that is a gradient names it without quotes, as an attribute does', links.every((e) => FILE_PAINT.every((n) => !/url\(["']/.test(e.getAttribute(n) || ''))));
    check(name + ': ... and each states as an attribute what the window\'s states as a style (' + stated + ' paints)', stated > 60 && differ.length === 0,
        differ.length + ': ' + differ.slice(0, 3).join(' | '));
    check(name + ': ... the page\'s ground among them, which the file has white', groundWindow !== groundFile && /255, 255, 255/.test(groundFile), groundWindow + ' / ' + groundFile);
    const foreign = notOfSvg11(shown);
    check(name + ': no paint of the file is "transparent" or a colour with an alpha', foreign.length === 0, foreign.length + ': ' + foreign.slice(0, 3).join(' | '));
    return {clear: clear, sheer: sheer, differ: differ.length};
}

// The paints SVG 1.1 does not have, on trees that draw them: the heat map's pointer surface and a legend's rows
// ("transparent"), a time tree's age intervals and fossil ranges (a fill with an alpha, a stroke with one).
async function filePaints() {
    const cases = [
        {file: '../../docs/data/sparse-accessory-genome.xml', config: {showHeatmap: true}, clear: 2, sheer: 0},
        // node ages with their intervals: translucent bars
        {file: '../../docs/data/nextstrain-ncov.json', config: {}, clear: 0, sheer: 8},
        // fossil ranges: bars, and end caps that are strokes; in the circular layout the bars are strokes too
        {file: '../../docs/data/ammonite-time-tree.xml', config: {}, clear: 0, sheer: 15},
        {file: '../../docs/data/ammonite-time-tree.xml', config: {}, circular: true, clear: 0, sheer: 15}
    ];
    for (const c of cases) {
        const trees = archaeopteryx.parseTrees(c.file, await (await fetch(c.file)).text());
        const viewer = archaeopteryx.launch('#phylogram1', trees, c.config);
        await viewer.ready;
        await sleep(1500);
        if (c.circular) { byId('layout_circ_b').closest('label').click(); await sleep(1800); }
        const name = c.file.split('/').pop() + (c.circular ? ' circular' : '');
        const section = document.querySelector('fieldset.aptx-download');
        if (section.classList.contains('aptx-collapsed')) { section.querySelector(':scope > legend').click(); await sleep(200); }
        byId('dl_shown_b').closest('label').click();
        await sleep(100);
        const live = document.querySelector('rect.basebackground').ownerSVGElement;
        const f = await download('SVG');
        const shown = f ? await svgOf(f) : null;
        check(name + ': an svg file came', !!shown);
        if (!shown) { continue; }
        const found = fileAgainstWindow(name, live, shown);
        // the fixture has to draw what this is about, or it proves nothing
        check(name + ': the window draws at least ' + c.clear + ' "transparent" paints and ' + c.sheer + ' with an alpha',
            found.clear >= c.clear && found.sheer >= c.sheer, found.clear + ' and ' + found.sheer);
        if (c !== cases[0]) { continue; }
        // What no tree draws today, put into the tree here to enter the branches its shapes do not reach: a colour
        // with an alpha on a shape that is handed an opacity as well (the two multiply); on a GROUP, where an
        // opacity of its own would reach the shapes in it that have their own colour (left as it is); on the
        // stops of a gradient (which take "stop-opacity", have no "none", and are handed nothing by the gradient).
        const probe = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        probe.setAttribute('class', 'aptx-test-probe');
        probe.style.setProperty('fill-opacity', '0.5');
        probe.innerHTML = '<rect width="1" height="1" style="fill: rgba(10, 20, 30, 0.5)"></rect>'
            + '<rect width="1" height="1" style="fill: rgba(10, 20, 30, 0.5); fill-opacity: 0.2; stroke: rgba(1, 2, 3, 0.25)"></rect>'
            + '<g style="fill: rgba(40, 50, 60, 0.5)"><rect width="1" height="1" style="fill: rgb(70, 80, 90)"></rect><rect width="1" height="1"></rect></g>'
            + '<linearGradient id="aptx-test-ramp" style="stop-opacity: 0.5"><stop offset="0" style="stop-color: rgba(1, 2, 3, 0.5)"></stop>'
            + '<stop offset="1" style="stop-color: transparent; stop-opacity: 0.5"></stop></linearGradient>';
        live.children[1].appendChild(probe);
        const f2 = await download('SVG');
        const again = f2 ? await svgOf(f2) : null;
        probe.remove();
        const p = again ? again.querySelector('.aptx-test-probe') : null;
        check(name + ': a second svg file came, with the shapes put in', !!p && p.children.length === 4);
        if (!p) { continue; }
        const says = (e) => ['fill', 'fill-opacity', 'stroke', 'stroke-opacity', 'stop-color', 'stop-opacity'].filter((n) => e.hasAttribute(n))
            .map((n) => n + '=' + e.getAttribute(n)).join(' ');
        const [handed, own, group, ramp] = p.children;
        check('an alpha goes into the opacity the shape is handed: 0.5 of 0.5', says(handed) === 'fill=rgb(10, 20, 30) fill-opacity=0.25', says(handed));
        check('... or into the one it states itself: 0.5 of 0.2; a stroke\'s into the stroke\'s', says(own) === 'fill=rgb(10, 20, 30) fill-opacity=0.1 stroke=rgb(1, 2, 3) stroke-opacity=0.25', says(own));
        check('a group keeps its colour as it is: its opacity would reach the shape in it that has its own colour',
            says(group) === 'fill=rgba(40, 50, 60, 0.5)' && says(group.children[0]) === 'fill=rgb(70, 80, 90)' && says(group.children[1]) === '',
            says(group) + ' / ' + says(group.children[0]) + ' / ' + says(group.children[1]));
        check('a gradient\'s stop: its alpha into stop-opacity, and no colour at all is an opacity of none',
            says(ramp.children[0]) === 'stop-color=rgb(1, 2, 3) stop-opacity=0.5' && says(ramp.children[1]) === 'stop-color=rgb(0, 0, 0) stop-opacity=0',
            says(ramp.children[0]) + ' / ' + says(ramp.children[1]));
    }
}

(async function () {
    if (q.get('paints') === '1') {
        await filePaints();
        finish();
        return;
    }
    if (q.get('cap') === '1') {
        await cappedRadial();
        finish();
        return;
    }
    if (q.get('legends') === '1') {
        await legendCards();
        finish();
        return;
    }
    if (q.get('subtree') === '1') {
        await subtreeFiles();
        finish();
        return;
    }
    if (q.get('subtree') === 'div') {
        await subtreeFromDiv();
        finish();
        return;
    }
    if (q.get('keeps') === '1') {
        await keptFile('../../docs/data/apaf.xml', 'apaf', (had) => had.domains > 100);
        finish();
        return;
    }
    if (q.get('keeps') === 'genes') {
        // every sequence of the genome-regions fixture has a location, 133 of them
        await keptFile('../data/genome_regions.xml', 'genome regions', (had) => had.locations === 133 && had.annotations > 200);
        finish();
        return;
    }
    if (q.get('seqs') === '1') {
        // room for the whole panel, so nothing is folded to fit
        byId('phylogram1').style.cssText = 'position:absolute;left:0;top:0;width:1100px;height:2400px';
        await nexusPromise();
        finish();
        return;
    }
    let file = q.get('tree') || '../../docs/data/flu_h5.xml';
    let text;
    if (q.get('big')) {
        // big enough that full size passes the PDF page limit and the PNG
        // canvas limit -- no tree in docs/data is, at the default font
        let n = 0;
        const clade = (k) => k === 1 ? 'tip' + (++n) + ':0.1'
            : '(' + clade(Math.floor(k / 2)) + ',' + clade(k - Math.floor(k / 2)) + '):0.05';
        text = clade(+q.get('big')) + ';';
        file = 'big.tre';
    } else {
        text = await (await fetch(file)).text();
    }
    const trees = await launch(file, text);
    const tree = Array.isArray(trees) ? trees[0] : trees;
    if (q.get('layout')) {
        const seg = byId(q.get('layout') === 'circular' ? 'layout_circ_b' : 'layout_unrooted_b');
        seg.closest('label').click();
        await sleep(1800);
    }
    const names = tipNames(tree);
    const tips = forester.getAllExternalNodes(tree).length;

    // ---- the section -------------------------------------------------------
    const section = document.querySelector('fieldset.aptx-download');
    const legend = section && section.querySelector(':scope > legend');
    check('Download is a titled section', !!legend && legend.textContent.trim() === 'Download');
    // it starts folded (checked where the panel has room: seqs=1); unfolded
    // here to measure and to use
    if (section && section.classList.contains('aptx-collapsed')) {
        legend.click();
        await sleep(200);
    }
    // A button's words sit in its middle and fit inside it. Measured on the
    // text itself: the button was a fixed 60px, the word wider, and it ran
    // into the right edge -- centred by its CSS and off-centre on screen.
    for (const id of ['dl_b', 'copy_nh_b', 'copy_png_b']) {
        const b = byId(id);
        const range = document.createRange();
        range.selectNodeContents(b);
        const tr = range.getBoundingClientRect();
        const br = b.getBoundingClientRect();
        const off = ((tr.left + tr.right) / 2) - ((br.left + br.right) / 2);
        // on screen at all first: a folded section's buttons measure 0 wide,
        // and a zero-width text is centred in a zero-width button
        check(id + ': its words are centred and inside it', br.width > 20 && tr.width > 10
            && Math.abs(off) <= 1.5 && tr.left >= br.left && tr.right <= br.right,
            'text ' + tr.left.toFixed(1) + '..' + tr.right.toFixed(1) + ' in button '
                + br.left.toFixed(1) + '..' + br.right.toFixed(1) + ', off centre by ' + off.toFixed(1));
    }
    check('Full size is the graphics default', byId('dl_full_b').checked === true);
    check('4x is the PNG default', byId('dl_png4_b').checked === true);

    if (q.get('shot') === 'panel') { finish(); return; }

    // ---- the menu ----------------------------------------------------------
    byId('dl_b').click();
    await sleep(150);
    const m = menu();
    check('the Download button opens a menu', !!m);
    if (!m) { finish(); return; }
    const headings = [...m.querySelectorAll('.aptx-node-menu-heading')].map((h) => h.textContent);
    out.push('menu groups: ' + headings.join(' | '));
    check('... grouped as graphics and tree', headings.length >= 2
        && /^Graphics/.test(headings[0]) && headings[1] === 'Tree');
    const entries = [...m.querySelectorAll('button')];
    const bare = entries.filter((b) => !b.querySelector('.aptx-menu-detail')
        || b.querySelector('.aptx-menu-detail').textContent.trim() === '');
    check('every format says what it keeps', entries.length >= 6 && bare.length === 0,
        entries.length + ' entries, ' + bare.length + ' without');
    const mr = m.getBoundingClientRect();
    check('... and the menu is inside the window', mr.top >= 0 && mr.left >= 0
        && mr.bottom <= innerHeight && mr.right <= innerWidth,
        mr.left.toFixed(0) + ',' + mr.top.toFixed(0) + ' ' + mr.width.toFixed(0) + 'x' + mr.height.toFixed(0));
    if (q.get('shot') === 'menu') { finish(); return; }
    byId('dl_b').click();
    await sleep(150);
    check('pressed again, the button closes it', !menu());

    // ---- the tree formats --------------------------------------------------
    byId('dl_name').value = 'my figure.svg';
    let f = await download('Newick');
    check('Newick is named from the name field, its typed extension not doubled',
        f && f.name === 'my figure.tre', f && f.name);
    byId('dl_name').value = 'fig/1';
    f = await download('Newick');
    check('... and a path separator cannot get into the name', f && f.name === 'fig_1.tre', f && f.name);
    const nhText = f ? await f.blob.text() : '';
    const nh = forester.parseNewHampshire(nhText, true, false);
    check('the Newick file reads back with every tip', tipNames(nh).length === names.length,
        tipNames(nh).length + ' of ' + names.length);
    byId('copy_nh_b').click();
    await sleep(200);
    check('Copy Newick copies what the Newick download writes', copied === nhText,
        copied === null ? 'nothing copied' : copied.length + ' vs ' + nhText.length + ' chars');
    check('... and says so on its face', /Copied/.test(byId('copy_nh_b').textContent),
        byId('copy_nh_b').textContent);
    f = await download('phyloXML');
    const px = f ? phyloXml.parse(await f.blob.text(), {trim: true, normalize: true})[0] : null;
    check('the phyloXML file reads back with every tip', px && tipNames(px).length === names.length,
        px ? tipNames(px).length + ' of ' + names.length : 'no file');
    if (px) {
        checkCarried(tree, px);
    }
    f = await download('Nexus');
    const nexText = f ? await f.blob.text() : '';
    check('the Nexus file carries the tree', /Begin Trees;/.test(nexText) && f.name === 'fig_1.nexus',
        f && f.name);
    byId('dl_name').value = 'tips.tsv';
    f = await download('TSV');
    check('... and a typed .tsv is not doubled either', f && f.name === 'tips.tsv', f && f.name);
    byId('dl_name').value = 'fig/1';
    f = await download('TSV');
    const tsv = f ? (await f.blob.text()).split('\n').filter((l) => l !== '') : [];
    const header = tsv.length ? tsv[0].split('\t') : [];
    out.push('TSV: ' + (tsv.length - 1) + ' rows, columns ' + header.join(', ').slice(0, 120));
    check('the TSV file has a row per tip, under a header naming them', f && f.name === 'fig_1.tsv'
        && tsv.length - 1 === tips && header.indexOf('name') >= 0
        && tsv.slice(1).every((l) => l.split('\t').length === header.length),
        f && f.name + ', ' + (tsv.length - 1) + ' rows of ' + tips + ' tips');
    byId('dl_name').value = '';
    f = await download('Newick');
    check('an empty name falls back to the tree\'s', f && f.name.length > 4 && f.name !== '.tre', f && f.name);

    // ---- graphics: as shown -------------------------------------------------
    const live = document.querySelector('rect.basebackground').ownerSVGElement;
    // The tree group as DRAWN: every element with its attributes sorted. Its
    // innerHTML is not that -- a label re-created by the full-size redraws
    // comes back with the same attributes set in another order.
    const canon = (el) => '<' + el.tagName + ' ' + [...el.attributes].map((a) => a.name + '=' + a.value).sort().join(' ')
        + '>' + [...el.childNodes].map((c) => c.nodeType === 1 ? canon(c) : (c.nodeValue || '')).join('') + '</>';
    const snapshot = () => canon(live.children[1]);   // the tree group, after the background
    const before = snapshot();
    byId('dl_shown_b').closest('label').click();
    await sleep(100);
    f = await download('SVG');
    const shown = f ? await svgOf(f) : null;
    const shownNames = shown ? tipLabelsIn(shown) : 0;
    check('as shown: the SVG is the window\'s size', shown
        && +shown.getAttribute('width') === live.width.baseVal.value
        && +shown.getAttribute('height') === live.height.baseVal.value,
        shown && shown.getAttribute('width') + 'x' + shown.getAttribute('height'));
    out.push('as shown: ' + shownNames + ' of ' + tips + ' tip names in the SVG');
    // The live svg says some things only for the page it is drawn in (a class the viewer's sheet knows it by, its
    // size a second time, inline, against a page's rule for a bare "svg"): a file has no page, and an inline size
    // would hold a full-size drawing to the window's. Its font is the file's as well: a text that states only a
    // size would otherwise be drawn in whatever the program opening the file thinks best.
    const pageOnly = (svg) => (svg.getAttribute('class') === null && !svg.style.width && !svg.style.height) ? ''
        : 'class "' + svg.getAttribute('class') + '", style "' + svg.getAttribute('style') + '"';
    check('the live svg has its class and its size inline', live.classList.contains('aptx-tree')
        && live.style.width === live.width.baseVal.value + 'px' && live.style.height === live.height.baseVal.value + 'px',
        live.getAttribute('class') + ' / ' + live.style.width + ' x ' + live.style.height);
    check('as shown: the file carries neither', !!shown && pageOnly(shown) === '', shown && pageOnly(shown));
    check('as shown: the file states the tree\'s font', !!shown && /system-ui/.test(shown.style.fontFamily), shown && shown.getAttribute('style'));
    // On the page a shape's paint is an inline style; a FILE says it as attributes again, and its colours as
    // SVG 1.1 has them (fileAgainstWindow, below).
    if (shown) { fileAgainstWindow('as shown', live, shown); }

    // ---- graphics: full size ------------------------------------------------
    byId('dl_full_b').closest('label').click();
    await sleep(100);
    const t0 = performance.now();
    f = await download('SVG');
    const ms = performance.now() - t0;
    const full = f ? await svgOf(f) : null;
    const fullNames = full ? tipLabelsIn(full) : 0;
    check('full size: the file carries no class and no inline size of the page\'s', !!full && pageOnly(full) === '', full && pageOnly(full));
    check('full size: the file states the tree\'s font', !!full && /system-ui/.test(full.style.fontFamily), full && full.getAttribute('style'));
    check('full size: no shape of the file states its paint in a style, and ' + (full ? paintAsAttribute(full) : 0) + ' paints are attributes',
        !!full && paintInStyle(full).length === 0 && paintAsAttribute(full) > 100, full && paintInStyle(full).length + ': ' + paintInStyle(full).slice(0, 3).join(' | '));
    check('full size: no paint of the file is "transparent" or a colour with an alpha', !!full && notOfSvg11(full).length === 0, full && notOfSvg11(full).slice(0, 3).join(' | '));
    if (q.get('shot') === 'full' && full) {
        // the exported picture itself, fitted to the window, for a human to look at
        document.body.innerHTML = '';
        document.body.style.background = '#888';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f.blob);
        img.style.cssText = 'display:block;max-width:100vw;max-height:100vh;margin:auto;background:#fff';
        document.body.appendChild(img);
        await sleep(800);
        finish();
        return;
    }
    const fw = full ? +full.getAttribute('width') : 0;
    const fh = full ? +full.getAttribute('height') : 0;
    out.push('full size: ' + fw + 'x' + fh + ' px, ' + fullNames + ' of ' + tips
        + ' tip names, in ' + ms.toFixed(0) + ' ms');
    // the precondition, or the next check proves nothing: the window must
    // actually be hiding names for "full size" to have anything to add
    check('the fixture crowds the window (as shown drops names)', shownNames < tips,
        shownNames + ' of ' + tips);
    const unrooted = q.get('layout') === 'unrooted';
    // unrooted has no rows and no ring: names on a cluster of short branches
    // collide at any size (flu_h5: 176 of 354 still refused at 67,000 px), so
    // there the bar is only that full size draws more than the window does
    check(unrooted ? 'full size: more tip names than the window' : 'full size: every tip name is in the SVG',
        unrooted ? fullNames > shownNames : fullNames === tips,
        fullNames + ' of ' + tips);
    check('... and the SVG is its own size, not the window\'s', fw > 0 && fh > 0
        && (fw !== live.width.baseVal.value || fh !== live.height.baseVal.value));
    // the drawing is cropped to the tree: every piece of ink inside the page
    {
        const holder = document.createElement('div');
        holder.style.cssText = 'position:fixed;left:-100000px;top:0';
        holder.appendChild(document.importNode(full, true));
        document.body.appendChild(holder);
        const s = holder.firstChild;
        const sr = s.getBoundingClientRect();
        let outside = 0;
        s.querySelectorAll('text').forEach((t) => {
            if (t.textContent === '') { return; }
            const r = t.getBoundingClientRect();
            if (r.left < sr.left - 0.5 || r.top < sr.top - 0.5 || r.right > sr.right + 0.5
                || r.bottom > sr.bottom + 0.5) { ++outside; }
        });
        check('... with every label inside the page', outside === 0, outside + ' outside');
        // the legend cards stand beside the tree, not on it (the page's
        // second child is the tree group, after the background)
        const treeBox = s.children[1].getBoundingClientRect();
        const cards = [...s.querySelectorAll(':scope > g.legendLabelColor, :scope > g.legendNodeShape')];
        const onTree = cards.filter((g) => { const r = g.getBoundingClientRect();
            return r.left < treeBox.right && r.right > treeBox.left && r.top < treeBox.bottom && r.bottom > treeBox.top; });
        out.push('legend cards: ' + cards.length);
        check('... and no legend card lies on the tree', onTree.length === 0, onTree.length + ' of ' + cards.length);
        holder.remove();
    }
    const after = snapshot();
    let at = 0;
    while (at < before.length && before[at] === after[at]) { ++at; }
    check('... and the window is left exactly as it was', after === before,
        before.length + ' vs ' + after.length + ' chars of tree'
        + (after === before ? '' : ', first difference at ' + at + ': "' + before.substr(Math.max(0, at - 60), 120)
            + '" became "' + after.substr(Math.max(0, at - 60), 120) + '"'));

    // ---- PNG and PDF, full size --------------------------------------------
    for (const k of [2, 8]) {
        byId('dl_png' + k + '_b').closest('label').click();
        await sleep(50);
        f = await download('PNG');
        const bmp = f ? await createImageBitmap(f.blob) : null;
        const want = Math.round(fw * k);
        out.push('PNG ' + k + 'x: ' + (bmp ? bmp.width + 'x' + bmp.height : 'none'));
        // exactly k x, or -- where the browser cannot paint that much -- less,
        // but never nothing, and never out of proportion
        check('PNG ' + k + 'x: the image is ' + k + 'x the drawing, or as near as the browser paints',
            bmp && bmp.width <= want && bmp.width > fw * 0.5
            && sameShape(bmp.width, bmp.height, fw, fh),
            bmp ? bmp.width + ' vs ' + want : 'no image');
        if (bmp) {
            // and it is not blank: a canvas past the browser's cap paints nothing
            const c = new OffscreenCanvas(bmp.width, bmp.height);
            const ctx = c.getContext('2d');
            ctx.drawImage(bmp, 0, 0);
            const d = ctx.getImageData(0, 0, bmp.width, bmp.height).data;
            let dark = 0;
            for (let i = 0; i < d.length; i += 4 * 97) { if (d[i] < 128) { ++dark; } }
            check('PNG ' + k + 'x: the tree is painted on it', dark > 50, dark + ' dark samples');
        }
    }
    // Copy PNG: the same picture as the PNG download, on the clipboard
    byId('dl_png2_b').closest('label').click();
    await sleep(50);
    copiedItems = null;
    byId('copy_png_b').click();
    {
        const t1 = Date.now();
        while (!copiedItems && Date.now() - t1 < 20000) { await sleep(50); }
    }
    const clip = copiedItems ? await createImageBitmap(await copiedItems[0].getType('image/png')) : null;
    check('Copy PNG puts the drawing on the clipboard at the chosen scale', clip
        && clip.width === Math.round(fw * 2) && sameShape(clip.width, clip.height, fw, fh),
        clip ? clip.width + 'x' + clip.height + ' vs ' + Math.round(fw * 2) : 'nothing copied');
    await sleep(100);
    check('... and says so on its face', /Copied/.test(byId('copy_png_b').textContent),
        byId('copy_png_b').textContent);
    // and when the picture cannot be made, the button says so rather than
    // leaving the clipboard write waiting forever (no serializer: no graphic)
    {
        const keep = window.XMLSerializer;
        window.XMLSerializer = undefined;
        await sleep(1700);   // the previous "Copied" has gone back to the name
        byId('copy_png_b').click();
        await sleep(400);
        window.XMLSerializer = keep;
        check('Copy PNG says when it failed', /failed/.test(byId('copy_png_b').textContent),
            byId('copy_png_b').textContent);
    }
    f = await download('PDF');
    const pageSize = f && f.pdf ? f.pdf.internal.pageSize : null;
    const pw = pageSize ? pageSize.getWidth() : 0;
    const ph = pageSize ? pageSize.getHeight() : 0;
    out.push('PDF page: ' + pw.toFixed(0) + 'x' + ph.toFixed(0) + ' pt');
    check('PDF: a page within the 200-inch limit, in the drawing\'s proportions', f && f.name.endsWith('.pdf')
        && pw > 0 && pw <= 14400.5 && ph <= 14400.5 && sameShape(pw, ph, fw, fh), (pw / ph).toFixed(4)
        + ' vs ' + (fw / fh).toFixed(4));
    finish();
})().catch((e) => { check('the harness ran', false, String(e && e.stack || e)); finish(); });

// Every card the viewer pins to the window -- the colour and shape legends,
// the domain legend, the heat-map ring's scale -- lands in the full-size
// figure beside the tree: present, on the page, and off the tree. Only the
// colour legend was moved at first; the domain legend landed on the tree
// and half off the page (the review of 15857e6..12e5d62 caught it).
// A radial full-size drawing is bounded (FULL_SIZE_RADIAL_MAX_SIDE, 6,000 px
// a side): bcl2 in the unrooted layout kept freeing a few names per growth
// step all the way to 45,000 px, the PNG was painted at 0.43x and the
// branches and names vanished while the shaded boxes stayed (Christian,
// 2026-10-20, "only the shaded boxes and nothing else"). The export is at
// most the bound plus the legend column and margins, the PNG paints at the
// chosen scale, and the tree is on it.
async function cappedRadial() {
    const warnings = [];
    const warn = console.warn;
    console.warn = function () { warnings.push([...arguments].join(' ')); warn.apply(console, arguments); };
    const text = await (await fetch('../../docs/data/bcl2.xml')).text();
    const viewer = archaeopteryx.launch('#phylogram1', archaeopteryx.parseTrees('bcl2.xml', text),
        {layout: 'unrooted', colorizeByRank: true, annotateByRank: true, cladeMarkStyle: 'boxes'});
    window.__aptxViewer = viewer;
    await viewer.ready;
    await sleep(1800);
    check('cap: the unrooted bcl2 draws its shaded boxes', document.querySelectorAll('g.aptx-rankmarks > g:nth-child(1) > path').length > 50,
        document.querySelectorAll('g.aptx-rankmarks > g:nth-child(1) > path').length);
    const f = await download('SVG');
    const svg = await svgOf(f);
    const w = +svg.getAttribute('width');
    const h = +svg.getAttribute('height');
    check('cap: the full-size SVG is at most the bound plus the legend column and margins', w > 2000 && w < 6000 + 400 && h > 2000 && h < 6000 + 100, w + 'x' + h);
    check('cap: the SVG holds the branches, the names and the boxes', svg.querySelectorAll('g.aptx-branches path').length > 0
        && [...svg.querySelectorAll('text.extlabel')].filter((t) => t.textContent.trim() !== '').length > 40
        && svg.querySelectorAll('g.aptx-rankmarks path').length > 50,
        svg.querySelectorAll('g.aptx-branches path').length + ' ' + svg.querySelectorAll('text.extlabel').length + ' ' + svg.querySelectorAll('g.aptx-rankmarks path').length);
    byId('dl_png2_b').closest('label').click();
    await sleep(50);
    const p = await download('PNG');
    const bm = await createImageBitmap(p.blob);
    check('cap: the PNG paints at the chosen 2x, no fallback', bm.width === Math.round(w * 2) && bm.height === Math.round(h * 2)
        && !warnings.some((x) => /rather than/.test(x)), bm.width + 'x' + bm.height + ' ' + warnings.join(' | '));
    const c = document.createElement('canvas');
    c.width = bm.width; c.height = bm.height;
    const g = c.getContext('2d');
    g.drawImage(bm, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data;
    let dark = 0;
    for (let i = 0; i < d.length; i += 4 * 97) { if (d[i] < 128 && d[i + 1] < 128 && d[i + 2] < 128) { ++dark; } }
    check('cap: the tree is painted on the PNG, not the boxes alone', dark > 200, dark + ' dark samples');
    console.warn = warn;
}

async function legendCards() {
    const cases = [
        {file: '../../docs/data/apaf.xml', config: {}, domains: 'legend', circular: false},
        {file: '../../docs/data/sparse-accessory-genome.xml', config: {showHeatmap: true}, circular: true},
        // the gene track's families card, and the arrows themselves in the saved figure
        {file: '../data/genome_regions.xml', config: {geneLabels: 'legend'}, genes: 116, circular: false},
        // clades by rank: the "Genus clades" card, and the 17 clade bars with their names in the saved figure
        {file: '../../docs/data/Caliciviridae_100.xml', config: {colorizeByRank: true, annotateByRank: true}, ranks: 17, circular: false},
        // the shaded boxes: translucent on screen by a style, in the file by a fill-opacity attribute
        {file: '../../docs/data/Caliciviridae_100.xml', config: {annotateByRank: true, cladeMarkStyle: 'boxes'}, ranks: 17, boxes: true, circular: false}
    ];
    for (const c of cases) {
        const trees = archaeopteryx.parseTrees(c.file, await (await fetch(c.file)).text());
        const viewer = archaeopteryx.launch('#phylogram1', trees, c.config);
        await viewer.ready;
        await sleep(1500);
        if (c.domains) {
            const sel = byId('domain_labels');
            sel.value = c.domains;
            sel.dispatchEvent(new Event('change'));
            await sleep(1200);
        }
        if (c.circular) {
            byId('layout_circ_b').closest('label').click();
            await sleep(1500);
        }
        const name = c.file.split('/').pop() + (c.circular ? ' circular' : '') + (c.boxes ? ' boxes' : '');
        const live = document.querySelector('rect.basebackground').ownerSVGElement;
        const classes = ['legendLabelColor', 'legendNodeShape', 'legendRank', 'legendDomains', 'legendGenes', 'aptx-heatmap-ringlegend']
            .filter((k) => live.querySelector(':scope > g.' + k));
        out.push(name + ': cards on screen: ' + classes.join(', '));
        const section = document.querySelector('fieldset.aptx-download');
        if (section.classList.contains('aptx-collapsed')) {
            section.querySelector(':scope > legend').click();
            await sleep(200);
        }
        const f = await download('SVG');
        const holder = document.createElement('div');
        holder.style.cssText = 'position:fixed;left:-100000px;top:0';
        holder.appendChild(document.importNode(await svgOf(f), true));
        document.body.appendChild(holder);
        const svg = holder.firstChild;
        // A file states its paint as attributes (see "as shown", above): the cards', the heat map's and the gene
        // arrows' too, and a paint that is a gradient of the file's own is named as an attribute names it.
        const PAINT = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray', 'stroke-linejoin',
            'text-anchor', 'dominant-baseline', 'vector-effect', 'stop-color', 'stop-opacity', 'opacity'];
        const drawn = [...live.querySelectorAll('*')].filter((e) => !e.closest('.aptx-overview, .aptx-hoverglow, circle.foundHalo'));
        const saved = [...svg.querySelectorAll('*')];
        const styled = saved.filter((e) => PAINT.some((n) => e.style.getPropertyValue(n) !== ''));
        check(name + ': no shape of the saved figure states its paint in a style', styled.length === 0 && saved.length > 50,
            styled.length + ' of ' + saved.length + (styled[0] ? ': ' + styled[0].tagName + ' ' + styled[0].getAttribute('style') : ''));
        const cleared = drawn.filter((e) => e.style.getPropertyValue('fill') === 'transparent').length;
        out.push(name + ': ' + cleared + ' shapes on screen are filled "transparent"');
        check(name + ': no paint of the saved figure is "transparent" or a colour with an alpha', notOfSvg11(svg).length === 0, notOfSvg11(svg).slice(0, 3).join(' | '));
        const gradients = (els, read) => els.filter((e) => /^url\(/.test(read(e) || ''));
        const want = gradients(drawn, (e) => e.style.getPropertyValue('fill'));
        const got = gradients(saved, (e) => e.getAttribute('fill'));
        out.push(name + ': ' + want.length + ' shapes on screen are filled with a gradient, ' + got.length + ' in the saved figure');
        check(name + ': a gradient is named as an attribute names it, and is in the file',
            got.length === want.length && got.every((e) => { const m = /^url\(#([^"')]+)\)$/.exec(e.getAttribute('fill')); return !!m && !!svg.querySelector('#' + m[1]); }),
            got.map((e) => e.getAttribute('fill')).slice(0, 3).join(' | '));
        const page = svg.getBoundingClientRect();
        const tree = svg.children[1].getBoundingClientRect();
        for (const k of classes) {
            const g = svg.querySelector(':scope > g.' + k);
            const r = g ? g.getBoundingClientRect() : null;
            const inPage = r && r.left >= page.left - 0.5 && r.top >= page.top - 0.5
                && r.right <= page.right + 0.5 && r.bottom <= page.bottom + 0.5;
            const onTree = r && r.left < tree.right && r.right > tree.left && r.top < tree.bottom && r.bottom > tree.top;
            check(name + ': the ' + k + ' card is in the figure, on the page, off the tree', r && inPage && !onTree,
                r ? 'at ' + (r.left - page.left).toFixed(0) + ',' + (r.top - page.top).toFixed(0) + ' in '
                    + page.width.toFixed(0) + 'x' + page.height.toFixed(0) + (onTree ? ', ON the tree' : '') : 'missing');
        }
        // the fixture has to carry the cards this is about, or it proves nothing
        check(name + ': the fixture shows the card under test', classes.includes(c.domains ? 'legendDomains'
            : c.genes ? 'legendGenes' : c.ranks ? 'legendRank' : 'aptx-heatmap-ringlegend'), classes.join(', '));
        if (c.ranks) {
            // the clade bars ride into the figure, each with its paint as an attribute, inside the page
            const bars = [...svg.querySelectorAll('g.aptx-rankmarks > g:nth-child(1) > rect')];
            const inside = bars.filter((b) => { const r = b.getBoundingClientRect();
                return r.left >= page.left - 0.5 && r.right <= page.right + 0.5 && r.top >= page.top - 0.5 && r.bottom <= page.bottom + 0.5; });
            check(name + ': the saved figure carries every clade bar, on the page, painted by attribute',
                bars.length === c.ranks && inside.length === c.ranks && bars.every((b) => /^#|^rgb/.test(b.getAttribute('fill') || '')),
                bars.length + ' bars, ' + inside.length + ' on the page');
            if (c.boxes) {
                check(name + ': every box states its translucency as a fill-opacity attribute',
                    bars.every((b) => Math.abs(parseFloat(b.getAttribute('fill-opacity')) - 0.18) < 1e-9 && !b.getAttribute('style')),
                    bars[0] ? bars[0].getAttribute('fill-opacity') + ' / ' + bars[0].getAttribute('style') : 'none');
            }
            const named = [...svg.querySelectorAll('g.aptx-rankmarks > g:nth-child(2) > text')].map((t) => t.textContent);
            check(name + ': ... and the clade names', named.length >= 8 && named.includes('Norovirus') && named.includes('Sapovirus'), named.join(', '));
            // the branches wear the clades' colours: the legend's swatch colours are among the branch strokes
            const strokes = new Set([...svg.querySelectorAll('g.aptx-branches > path')].map((p) => p.getAttribute('stroke')));
            const swatches = [...svg.querySelectorAll('g.legendRank > rect')].slice(1).map((r) => r.getAttribute('fill')).filter((f) => f && f !== 'none');
            if (!c.boxes) {
                check(name + ': the saved branches wear the legend\'s colours', swatches.length >= 10 && swatches.every((f) => strokes.has(f)),
                    swatches.filter((f) => !strokes.has(f)).join(', ') || 'all ' + swatches.length);
            }
        }
        if (c.genes) {
            // the track rides into the figure: every arrow, its backbones, and
            // the arrows inside the page
            const arrows = [...svg.querySelectorAll('g.aptx-genes > g:nth-child(2) > path')];
            const inside = arrows.filter((a) => { const r = a.getBoundingClientRect();
                return r.left >= page.left - 0.5 && r.right <= page.right + 0.5 && r.top >= page.top - 0.5 && r.bottom <= page.bottom + 0.5; });
            check(name + ': the saved figure carries every gene arrow, on the page', arrows.length === c.genes && inside.length === c.genes,
                arrows.length + ' arrows, ' + inside.length + ' on the page');
            check(name + ': ... and their backbones', !!svg.querySelector('g.aptx-genes > g:nth-child(1) > path'));
        }
        holder.remove();
    }
}

// A subtree saved while Div is on screen says what its lengths measure: the
// phylogeny's own attributes go with the part. Without branch_length_unit
// the file opened again labelled Time with its divergence for lengths -- the
// fault mended for whole trees on 2026-09-29, found for subtrees by review.
async function subtreeFromDiv() {
    const file = '../../docs/data/beast-annotations.nex';
    const trees = await launch(file, await (await fetch(file)).text());
    const tree = Array.isArray(trees) ? trees[0] : trees;
    const group = document.querySelector('#phylogram1 .branch_scale_g, .branch_scale_g');
    check('the clock tree is offered Time | Div', !!group && getComputedStyle(group).display !== 'none');
    byId('branch_scale_div_b').click();
    await sleep(1500);
    check('in Div the tree states subs/site', tree.branch_length_unit === 'subs/site', tree.branch_length_unit);
    const all = [];
    forester.preOrderTraversalAll(tree, (n) => all.push(n));
    const sub = all.find((n) => n.children && n.parent && n.parent.parent && n.parent.parent.parent
        && forester.getAllExternalNodes(n).length >= 2);
    window.__aptxViewer.applyViewState({subtree: sub.viewId});
    await sleep(1500);
    const tag = (xml) => (xml.match(/<phylogeny[^>]*>/) || ['none'])[0];
    const px = await download('phyloXML');
    const pxText = px ? await px.blob.text() : '';
    check('the subtree\'s phyloXML states subs/site', /branch_length_unit="subs\/site"/.test(tag(pxText)), tag(pxText));
    // and read back, it knows what it shows: divergence, with its time to come back to
    const back = phyloXml.parse(pxText, {trim: true, normalize: true})[0];
    forester.captureDivergence(back);
    forester.convertLoadedHeightsToDates([back]);
    const sum = (t) => { const r = forester.getTreeRoot(t); let x = 0; forester.preOrderTraversalAll(r, (n) => { if (n !== r && typeof n.branch_length === 'number') { x += n.branch_length; } }); return x; };
    const asSaved = sum(back);
    const offered = forester.hasTimeAndDivergence(back);
    const arrives = forester.branchLengthScale(back);
    forester.applyTimeBranchLengths(back);
    const inTime = sum(back);
    check('opened again, the part arrives showing divergence and Time lays it out from its dates',
        offered && arrives === 'divergence' && inTime > 10 * asSaved,
        'offered ' + offered + ', arrives in ' + arrives + ', lengths ' + asSaved.toPrecision(4) + ' -> Time ' + inTime.toPrecision(4));
    // the whole tree, back out of the view, says the same
    window.__aptxViewer.applyViewState({});
    await sleep(1200);
    const whole = await download('phyloXML');
    check('and the whole tree\'s file states subs/site too', /branch_length_unit="subs\/site"/.test(tag(whole ? await whole.blob.text() : '')));
}

// In a subtree the files hold the subtree -- the menu says so, and the file
// keeps the tree's name -- while a collapsed clade is still written whole:
// collapsing is how the tree is drawn, not what it contains.
async function subtreeFiles() {
    const file = '../../docs/data/swH1-HA1.nexus';
    const trees = await launch(file, await (await fetch(file)).text());
    const tree = Array.isArray(trees) ? trees[0] : trees;
    const N = forester.getAllExternalNodes(tree).length;
    const tipsUnder = (n) => forester.getAllExternalNodes(n).length;
    const all = [];
    forester.preOrderTraversalAll(tree, (n) => all.push(n));
    const sub = all.filter((n) => n.children && n !== tree && n !== tree.children[0] && tipsUnder(n) < N)
        .sort((a, b) => Math.abs(tipsUnder(a) - 0.4 * N) - Math.abs(tipsUnder(b) - 0.4 * N))[0];
    const inner = [];
    forester.preOrderTraversalAll(sub, (n) => inner.push(n));
    const col = inner.find((n) => n !== sub && n.children && tipsUnder(n) >= 2);
    const S = tipsUnder(sub);
    const readName = (xml) => (xml.match(/<phylogeny[^>]*>\s*<name>([^<]*)<\/name>/) || [])[1];
    const headings = async () => {
        byId('dl_b').click();
        await sleep(150);
        const h = [...menu().querySelectorAll('.aptx-node-menu-heading')].map((x) => x.textContent);
        byId('dl_b').click();
        await sleep(100);
        return h;
    };

    // the whole tree first: its file's name, and a menu with nothing to say
    const whole = await download('phyloXML');
    const name = readName(whole ? await whole.blob.text() : '');
    let h = await headings();
    check('whole tree: the menu says nothing of a subtree', h.indexOf('Tree') >= 0 && h.indexOf('Tip data') >= 0,
        h.join(' | '));
    out.push('tree name: ' + name);

    window.__aptxViewer.applyViewState({subtree: sub.viewId, collapsed: [col.viewId]});
    await sleep(1500);
    h = await headings();
    const note = 'subtree, ' + S + ' of ' + N + ' tips';
    out.push('menu groups: ' + h.join(' | '));
    check('subtree: the menu says the files are a part of the tree', h.indexOf('Tree: ' + note) >= 0
        && h.indexOf('Tip data: ' + note) >= 0, 'expected "' + note + '"');
    const px = await download('phyloXML');
    const pxText = px ? await px.blob.text() : '';
    const pxTree = phyloXml.parse(pxText, {trim: true, normalize: true})[0];
    check('subtree phyloXML: the subtree\'s tips, the tree\'s name', tipsUnder(pxTree) === S
        && readName(pxText) === name + ' (subtree)', tipsUnder(pxTree) + ' tips, "' + readName(pxText) + '"');
    const nex = await download('Nexus');
    const nexText = nex ? await nex.blob.text() : '';
    const treeLine = (nexText.match(/ Tree ([^=]*)=/) || [])[1];
    check('subtree Nexus: the subtree\'s taxa, the tree\'s name', /NTax=(\d+)/.exec(nexText)[1] === String(S)
        && treeLine === "'" + name + " (subtree)'", treeLine);
    const tsv = await download('TSV');
    const rows = tsv ? (await tsv.blob.text()).trim().split('\n').length - 1 : 0;
    check('subtree TSV: every tip of the subtree, the collapsed clade\'s too', rows === S, rows + ' of ' + S);

    // and nothing leaked back: out of the subtree, the tree is written as before
    window.__aptxViewer.applyViewState({});
    await sleep(1500);
    const again = await download('phyloXML');
    check('back on the whole tree, its file is exactly as it was', again && (await again.blob.text()) === (await whole.blob.text()));
}

// The Nexus entry says what the file will hold -- and the file agrees.
async function nexusPromise() {
    const tip = (n, s) => '<clade><name>' + n + '</name>'
        + (s ? '<sequence><mol_seq is_aligned="true">' + s + '</mol_seq></sequence>' : '') + '</clade>';
    const doc = (a, b, c) => '<phyloxml xmlns="http://www.phyloxml.org"><phylogeny rooted="true"><clade>'
        + '<clade>' + tip('A', a) + tip('B', b) + '</clade>' + tip('C', c) + '</clade></phylogeny></phyloxml>';
    const cases = [['aligned', doc('MKLEFIQ', 'MKL-FIQ', 'MRLEFIE'), false],
        ['ragged', doc('MKLEFIQ', 'MKLFIQ', 'MRLEFIEWW'), true]];
    for (const [name, xml, ragged] of cases) {
        await launch(name + '.xml', xml);
        const section = document.querySelector('fieldset.aptx-download');
        // folded by default (Christian, 2026-09-28), in a panel with room
        // for everything, so the fitter has had no reason to fold it
        check(name + ': the Download section starts folded', section && section.classList.contains('aptx-collapsed'));
        byId('dl_b').click();
        await sleep(150);
        const b = menuEntry('Nexus');
        const detail = b && b.querySelector('.aptx-menu-detail');
        out.push(name + ': "' + (detail ? detail.textContent : '') + '"');
        check(name + ': the menu offers FASTA', !!menuEntry('FASTA'));
        const before = files.length;
        b.click();
        const f = await nextFile(before);
        const text = f ? await f.blob.text() : '';
        const matrix = /Begin Characters;/.test(text);
        check(name + ': the file ' + (ragged ? 'leaves the sequences out' : 'carries the alignment'),
            matrix === !ragged);
        check(name + ': and the menu said so', detail && (ragged
            ? detail.classList.contains('aptx-menu-warn') && /without the sequences/.test(detail.textContent)
            : !detail.classList.contains('aptx-menu-warn') && /alignment/.test(detail.textContent)));
    }
}
