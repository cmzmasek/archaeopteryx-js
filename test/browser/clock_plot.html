<!doctype html>
<meta charset="utf-8"><title>The clock plot: a panel linked to the tree</title>
<style>html,body{margin:0;height:100%}#p{position:absolute;inset:0}</style>
<script src="../../docs/lib/d3.v7.min.js"></script>
<script src="../../docs/lib/sax.js"></script>
<script src="../../docs/lib/phyloxml.js"></script>
<script src="../../docs/lib/forester.js"></script>
<script src="../../docs/lib/archaeopteryx.js"></script>
<div id="p"></div>
<script>
// The CLOCK PLOT (Christian, 2026-10-02): every node's date against its
// divergence from the root, a least-squares line through the tips, in a
// modeless panel linked to the tree.
//
// What the plot should show is taken from the FILE's own numbers -- a
// Nextstrain build's num_date and div, read off the JSON here -- and the line
// is fitted here by the textbook sums, never by forester: the panel is then
// held against that. Where a point should be on the drawing is not assumed
// either: the drawing's own scale is recovered from two tips and every other
// point, and the line, must agree with it.
//
// (default)   docs/data/nextstrain-ncov.json: the button, the panel, the
//             points, the line and its numbers, the two checkboxes, pointing
//             (plot -> tree and tree -> plot), a click, a drag, Deselect all,
//             the view of a clade, the theme, the close control.
// ?rates=1    a BEAST clock-model tree (test/data/beast/beast-tip-dates.nex):
//             its divergence is time x rate, and the panel says so.
// ?refused=1  trees with no plot are not offered one: a clock tree whose tips
//             share one date (docs/data/beast-annotations.nex, which IS
//             offered Time | Div), and a plain Newick tree.
// ?ages=1     a clock tree stating heights (ages): time still runs left to
//             right, so the OLDER tip is on the left, and the rate is
//             positive though the divergence falls as the age rises.
// ?host=1     the page around the viewer keeps a box of its own in the top
//             right corner, above everything (the demo page's tree chooser
//             does): the panel opens BELOW it, its close control in reach.
//             Found on the live demo with a real mouse, 2026-10-02.
// ?clades=1   from the view of one clade straight to the view of another with
//             AS MANY NODES: the plot is the second clade's. (The plot is
//             worked out again when the top of the view or its node count
//             changes; every other case changes both at once.)
// ?same=1     tips drawn on ONE SPOT are one dot, and the dot answers for all
//             of them (code review; Christian, 2026-10-02): eight tips, seven
//             with one date and divergence and one a third of a pixel off,
//             are named together (the first five, "and 3 more"), lit
//             together and selected together by a click -- all of them, or
//             none where all were selected. A tip three pixels away is not
//             of the dot, nor is the ancestor drawn on the same spot.
// ?delete=1   a tip deleted with the panel open: the plot follows, with the
//             line of the tips that are left; a second one deleted leaves two
//             tips, no plot, and the panel and its button go.
// ?rtt=1      the second kind of tree (Christian, 2026-10-03): divergence
//             branch lengths, the tips alone dated. Offered though it has no
//             Time | Div; a tip's divergence is its path from the root;
//             tips only, so Internal nodes is not offered; Rate in no unit,
//             since the file states none; the tree states no root date; a
//             click selects; the view of a clade has the clade's own line.
// ?names=1    tips dated by their NAMES count (Christian, 2026-10-03):
//             docs/data/swH1-HA1.nexus, 50 strains with their year in the
//             name and no date anywhere else, is a root-to-tip tree: every
//             tip at its year (mid-year) and its path from the root, the
//             axis in calendar years, the note saying what was read.
(async function () {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const byId = (id) => document.getElementById(id);
    const out = []; let failures = 0;
    const check = (l, ok, d) => { if (!ok) { failures++; }
        out.push((ok ? 'pass  ' : 'FAIL  ') + l + (d === undefined ? '' : '   [' + d + ']')); };
    const near = (a, b, rel) => Math.abs(a - b) <= Math.max(Math.abs(a), Math.abs(b), 1e-300) * (rel || 1e-9);
    const shown = (el) => !!el && getComputedStyle(el).display !== 'none' && el.offsetParent !== null;
    const dialog = () => byId('aptx_clock_plot');
    const circles = (cls) => [...document.querySelectorAll('#aptx_clock_plot g.' + cls + ' circle')];
    const row = (key) => { const l = [...document.querySelectorAll('#aptx_clock_plot .aptx-clock-stats .aptx-dialog-line')]
        .find((x) => x.querySelector('.aptx-dialog-key').textContent === key);
        return l ? l.querySelector('.aptx-dialog-val').textContent : null; };
    // ordinary least squares, by the raw sums
    const ols = (pts) => { const n = pts.length; let sx = 0, sy = 0; pts.forEach((p) => { sx += p[0]; sy += p[1]; });
        const mx = sx / n, my = sy / n; let sxx = 0, sxy = 0, syy = 0;
        pts.forEach((p) => { sxx += (p[0] - mx) * (p[0] - mx); sxy += (p[0] - mx) * (p[1] - my); syy += (p[1] - my) * (p[1] - my); });
        const slope = sxy / sxx; return {n, slope, intercept: my - slope * mx, r2: (sxy * sxy) / (sxx * syy)}; };
    const sig3 = (v) => { const a = Math.abs(v); return (a !== 0 && (a < 1e-4 || a >= 1e7)) ? v.toExponential(2) : String(Number(v.toPrecision(3))); };
    const svgEl = () => document.querySelector('#aptx_clock_plot svg.aptx-clock-svg');
    const client = (cx, cy) => { const b = svgEl().getBoundingClientRect(); return {clientX: b.left + cx, clientY: b.top + cy}; };
    const pointer = (type, cx, cy) => svgEl().dispatchEvent(new PointerEvent(type, Object.assign({bubbles: true, cancelable: true,
        button: 0, pointerId: 1, view: window}, client(cx, cy))));
    const centre = (c) => [parseFloat(c.getAttribute('cx')), parseFloat(c.getAttribute('cy'))];
    const finish = () => { window.__benchResult = {report: out, failures: failures}; window.__benchDone = true; };
    try {
        const offered = () => shown(byId('clock_plot_b'));
        if (/refused=1/.test(location.search)) {
            const text = await (await fetch('../../docs/data/beast-annotations.nex')).text();
            const v = archaeopteryx.launch('#p', archaeopteryx.parseTrees('beast-annotations.nex', text), {});
            await v.ready; await sleep(1500);
            check('control: the clock tree IS offered Time | Div', shown(document.querySelector('#p .branch_scale_g')));
            check('its tips share one date: no Clock plot button', !!byId('clock_plot_b') && !offered());
            const v2 = archaeopteryx.launch('#p', archaeopteryx.parseTrees('plain.nwk', '((A:1,B:2):1,(C:1,D:3):2);'), {});
            await v2.ready; await sleep(1200);
            check('a plain Newick tree: no Clock plot button', !!byId('clock_plot_b') && !offered());
            // and the build IS offered one, with the same page still up: the
            // refusals above are not a button that never shows
            const v3 = archaeopteryx.launch('#p', archaeopteryx.parseTrees('nextstrain-ncov.json',
                await (await fetch('../../docs/data/nextstrain-ncov.json')).text()), {});
            await v3.ready; await sleep(1200);
            check('control: the Nextstrain build is offered the button', offered());
            finish();
            return;
        }
        if (/host=1/.test(location.search)) {
            const text = await (await fetch('../../docs/data/nextstrain-ncov.json')).text();
            const v = archaeopteryx.launch('#p', archaeopteryx.parseTrees('nextstrain-ncov.json', text), {});
            await v.ready; await sleep(1500);
            const topmostIsClose = () => { const c = dialog().querySelector('.aptx-dialog-close').getBoundingClientRect();
                const el = document.elementFromPoint((c.left + c.right) / 2, (c.top + c.bottom) / 2); return !!el && dialog().contains(el); };
            // control: nothing in the corner, the panel is in it
            byId('clock_plot_b').click(); await sleep(300);
            const free = dialog().getBoundingClientRect();
            check('control: with the corner free the panel opens in it', free.top < 30 && innerWidth - free.right < 30 && topmostIsClose(),
                Math.round(free.top) + ' from the top, ' + Math.round(innerWidth - free.right) + ' from the right');
            byId('clock_plot_b').click(); await sleep(300);
            const host = document.createElement('div');
            host.style.cssText = 'position:fixed;top:10px;right:10px;width:260px;height:90px;z-index:5000;background:#888';
            // a link across its top, where the panel's edge would be: what has
            // to be cleared is the box, not the link in it
            host.innerHTML = '<a href="#" style="display:block;padding:12px">a link of the page\'s own</a>';
            document.body.appendChild(host);
            const link = host.querySelector('a').getBoundingClientRect();
            check('fixture: the link lies across the top of the box and ends well above its bottom', link.top < 20 && link.bottom < 70 && link.width > 200,
                Math.round(link.top) + '..' + Math.round(link.bottom) + ', ' + Math.round(link.width) + ' wide');
            byId('clock_plot_b').click(); await sleep(300);
            const box = dialog().getBoundingClientRect(), hb = host.getBoundingClientRect();
            check('with the page\'s own box in the corner the panel opens below it', box.top >= hb.bottom, Math.round(box.top) + ' vs the box\'s bottom ' + Math.round(hb.bottom));
            check('...its close control on top and in reach', topmostIsClose());
            check('...still at the right, and inside the window', innerWidth - box.right < 30 && box.bottom <= innerHeight,
                Math.round(innerWidth - box.right) + ' from the right, bottom ' + Math.round(box.bottom) + ' of ' + innerHeight);
            finish();
            return;
        }
        if (/ages=1/.test(location.search)) {
            // heights 0..4 and one rate, 0.01, on every branch: a tip's
            // divergence is 0.01 x (4 - its height), so the tips lie on
            // div = 0.04 - 0.01 x age
            const v = archaeopteryx.launch('#p', archaeopteryx.parseTrees('ages.nex', '#NEXUS\nBegin trees;\ntree T = [&R] '
                + '((A[&rate=0.01,height=0]:2,B[&rate=0.01,height=1]:1)[&rate=0.01,height=2]:2,'
                + '(C[&rate=0.01,height=0.5]:2.5,D[&rate=0.01,height=2]:1)[&rate=0.01,height=3]:1)[&height=4];\nEnd;\n'), {});
            await v.ready; await sleep(1500);
            check('a clock tree stating heights is offered the Clock plot', offered());
            byId('clock_plot_b').click(); await sleep(300);
            const laid = dialog()._aptxClockPlot;
            const tl = laid.data.points.filter((p) => p.tip);
            const at = {}; circles('aptx-clock-tips').forEach((c, i) => { at[tl[i].node.name] = centre(c); });
            check('fixture: the tips are at ages 0, 1, 0.5 and 2', ['A', 'B', 'C', 'D'].map((n) => tl.find((p) => p.node.name === n).date).join() === '0,1,0.5,2');
            check('time runs left to right: the older a tip, the further left', at.D[0] < at.B[0] && at.B[0] < at.C[0] && at.C[0] < at.A[0],
                ['D', 'B', 'C', 'A'].map((n) => n + ' ' + at[n][0].toFixed(1)).join(', '));
            check('...and the more diverged, the higher', at.A[1] < at.C[1] && at.C[1] < at.B[1] && at.B[1] < at.D[1]);
            check('the axis is named Age', [...dialog().querySelectorAll('text.aptx-clock-title')].some((t) => t.textContent === 'Age'),
                [...dialog().querySelectorAll('text.aptx-clock-title')].map((t) => t.textContent).join(' | '));
            check('Rate is positive: 0.01, per unit of time', row('Rate') === '0.01 subs/site per unit of time', row('Rate'));
            check('Root date, by the line and in the tree: age 4', row('Root date, by the line') === '4' && row('Root date, in the tree') === '4',
                row('Root date, by the line') + ' / ' + row('Root date, in the tree'));
            finish();
            return;
        }
        if (/same=1/.test(location.search)) {
            const SAME = ['B1', 'B2', 'B3', 'B4', 'B5', 'B6', 'B7'];
            const T = {A: [2000, 0.001], C: [2002, 0.002], D: [2003, 0.006], E: [2001.03, 0.003], B8: [2001.004, 0.003]};
            SAME.forEach((n) => { T[n] = [2001, 0.003]; });
            const DOT = SAME.concat(['B8']).sort();
            const leaf = (n) => ({name: n, node_attrs: {num_date: {value: T[n][0]}, div: T[n][1]}});
            const inner = (n, date, div, kids) => ({name: n, node_attrs: {num_date: {value: date}, div: div}, children: kids});
            // X, the ancestor of the eight, states their date and divergence: its point is on their spot
            const trees = archaeopteryx.parseTrees('same.json', JSON.stringify({version: 'v2', meta: {title: 'eight tips on one spot'},
                tree: inner('ROOT', 1999, 0, [leaf('A'), inner('X', 2001, 0.003, SAME.concat(['B8']).map(leaf)), inner('Y', 2000.5, 0.001, ['C', 'D', 'E'].map(leaf))])}));
            const v = archaeopteryx.launch('#p', trees, {enableManualNodeSelection: true});
            await v.ready; await sleep(1500);
            const tree = Array.isArray(trees) ? trees[0] : trees;
            const nodeOf = (n) => forester.findByNodeName(forester.getTreeRoot(tree), n)[0];
            byId('clock_plot_b').click(); await sleep(300);
            const where = () => { const at = {}; const tl = dialog()._aptxClockPlot.data.points.filter((p) => p.tip);
                circles('aptx-clock-tips').forEach((c, i) => { at[tl[i].node.name] = centre(c); }); return at; };
            let at = where();
            const dist = (a, b) => Math.hypot(at[a][0] - at[b][0], at[a][1] - at[b][1]);
            check('fixture: seven tips on one spot exactly', SAME.every((n) => dist(n, 'B1') === 0));
            check('fixture: an eighth a fraction of a pixel off it', dist('B8', 'B1') > 0.1 && dist('B8', 'B1') < 1, dist('B8', 'B1').toFixed(2) + ' px');
            check('fixture: a ninth tip within reach of the pointer but off the spot', dist('E', 'B1') > 1.5 && dist('E', 'B1') < 7, dist('E', 'B1').toFixed(2) + ' px');
            const selected = () => archaeopteryx.getSelectedNodes().map((n) => n.name).sort().join(' ');
            const readout = () => document.querySelector('.node_mouseover_tooltip').textContent;
            // every disc group of the glow, where it is in the tree's own coordinates
            const lit = () => { const g = document.querySelector('#p g.aptx-hoverglow'); if (!g || g.style.display === 'none') { return []; }
                const tr = (el) => { const m = /translate\(([-\d.e]+)[ ,]+([-\d.e]+)\)/.exec(el.getAttribute('transform') || ''); return [+m[1], +m[2]]; };
                const o = tr(g); return [o].concat([...g.querySelectorAll('g.aptx-hoverglow-also')].map((x) => { const r = tr(x); return [o[0] + r[0], o[1] + r[1]]; })); };
            const litIs = (names) => { const got = lit().map((p) => p.map((x) => x.toFixed(1)).join()).sort().join(' ');
                const want = names.map((n) => [nodeOf(n).y, nodeOf(n).x].map((x) => x.toFixed(1)).join()).sort().join(' '); return got === want; };

            // ---- pointing at the dot
            pointer('pointermove', at.B1[0], at.B1[1]); await sleep(200);
            const text = readout();
            check('the readout says how many tips the dot stands for', text.indexOf('8 tips here') >= 0, text.slice(0, 80));
            const namedHere = DOT.filter((n) => new RegExp('Name' + n + '(?!\\d)').test(text));
            check('...names the first five of them, in the tree\'s order, and says three more', namedHere.join(' ') === 'B1 B2 B3 B4 B5'
                && text.indexOf('NameB1NameB2NameB3NameB4NameB5Name\u2026 and 3 more') >= 0, namedHere.join(' ') + ' | ' + text.slice(0, 90));
            check('...and not the tip three pixels away', !/NameE/.test(text));
            check('...with the date they span and the divergence they share', text.indexOf('Date2001 \u2013 2001.004 year') >= 0 && text.indexOf('Divergence0.003') >= 0
                && text.indexOf('Divergence0.003 \u2013') < 0, text.slice(text.indexOf('Date')));
            check('all eight are lit in the tree', lit().length === 8 && litIs(DOT), lit().length + ' lit');

            // ---- a click selects them all; again, deselects them all
            pointer('pointerdown', at.B1[0], at.B1[1]); pointer('pointerup', at.B1[0], at.B1[1]); await sleep(500);
            check('a click on the dot selects all eight, and nothing else', selected() === DOT.join(' '), selected());
            check('...and all eight are still lit after the redraw', lit().length === 8 && litIs(DOT), lit().length + ' lit');
            pointer('pointerdown', at.B1[0], at.B1[1]); pointer('pointerup', at.B1[0], at.B1[1]); await sleep(500);
            check('a second click, all eight being selected, deselects all eight', selected() === '', selected());

            // ---- one of them selected in the tree: a click selects the rest
            const g = [...document.querySelectorAll('#p g.node')].find((x) => x.__data__ && x.__data__.name === 'B4');
            const m = g.getScreenCTM();
            const tat = {clientX: m.e, clientY: m.f, bubbles: true, cancelable: true, view: window};
            g.ownerSVGElement.dispatchEvent(new MouseEvent('mousemove', tat));
            g.ownerSVGElement.dispatchEvent(new MouseEvent('click', tat)); await sleep(400);
            const item = [...document.querySelectorAll('.aptx-node-menu button')].find((b) => b.textContent === 'Select/Deselect Node');
            if (item) { item.click(); await sleep(600); }
            check('fixture: one tip of the dot selected from the node menu', selected() === 'B4', selected());
            pointer('pointermove', at.B1[0], at.B1[1]);
            pointer('pointerdown', at.B1[0], at.B1[1]); pointer('pointerup', at.B1[0], at.B1[1]); await sleep(500);
            check('one of the eight being selected, a click selects all eight', selected() === DOT.join(' '), selected());
            dialog().querySelector('.aptx-clock-deselect').click(); await sleep(400);

            // ---- the tip beside the dot is a point of its own
            pointer('pointermove', at.E[0] + 2, at.E[1]); await sleep(200);
            check('the tip three pixels away is pointed at alone', /NameE/.test(readout()) && readout().indexOf('tips here') < 0 && lit().length === 1 && litIs(['E']),
                readout().slice(0, 40) + ' | ' + lit().length + ' lit');
            pointer('pointerdown', at.E[0] + 2, at.E[1]); pointer('pointerup', at.E[0] + 2, at.E[1]); await sleep(500);
            check('...and selected alone', selected() === 'E', selected());
            dialog().querySelector('.aptx-clock-deselect').click(); await sleep(400);

            // ---- the ancestor on the same spot is not of the dot
            dialog().querySelectorAll('.aptx-clock-options input[type=checkbox]')[1].click(); await sleep(200);
            at = where();
            const il = dialog()._aptxClockPlot.data.points.filter((p) => !p.tip);
            const xc = centre(circles('aptx-clock-internal')[il.findIndex((p) => p.node.name === 'X')]);
            check('fixture: with Internal nodes on, the ancestor X is drawn on the dot\'s spot', Math.hypot(xc[0] - at.B1[0], xc[1] - at.B1[1]) === 0);
            pointer('pointermove', at.B1[0], at.B1[1]); await sleep(200);
            check('the dot still stands for the eight tips', readout().indexOf('8 tips here') >= 0 && lit().length === 8, readout().slice(0, 30) + ' | ' + lit().length + ' lit');
            pointer('pointerdown', at.B1[0], at.B1[1]); pointer('pointerup', at.B1[0], at.B1[1]); await sleep(500);
            check('...and a click selects the eight tips, not the ancestor', selected() === DOT.join(' '), selected());
            finish();
            return;
        }
        if (/rtt=1/.test(location.search)) {
            // the tree of test/clock_test.js: its lengths are divergence, its
            // tips alone carry a num_date, its ancestors none (TempEst's case)
            const trees = archaeopteryx.parseTrees('root_to_tip.nex', '#NEXUS\nBegin trees;\ntree T = [&R] ((A[&num_date=2000]:0.01,'
                + 'B[&num_date=2001]:0.03)X:0.005,(C[&num_date=2002]:0.02,D[&num_date=2003]:0.06,E[&num_date=2004]:0.04)Y:0.01);\nEnd;\n');
            const tree = Array.isArray(trees) ? trees[0] : trees;
            const v = archaeopteryx.launch('#p', trees, {});
            await v.ready; await sleep(1500);
            check('control: the tree has no Time | Div', !shown(document.querySelector('#p .branch_scale_g')));
            check('dated tips over divergence lengths: the Clock plot is offered', offered());
            byId('clock_plot_b').click(); await sleep(400);
            const dlg = dialog();
            check('the panel opens', !!dlg && dlg.open);
            if (!dlg) { finish(); return; }
            // the file's own numbers: each tip's date, and its path from the root
            // summed from the file's lengths
            const want = new Map([['A', [2000, 0.005 + 0.01]], ['B', [2001, 0.005 + 0.03]], ['C', [2002, 0.01 + 0.02]],
                ['D', [2003, 0.01 + 0.06]], ['E', [2004, 0.01 + 0.04]]]);
            const fit = ols([...want.values()]);
            check('fixture: by the raw sums, slope 0.0105 and R2 0.63', near(fit.slope, 0.0105) && near(fit.r2, 0.63), fit.slope + ' ' + fit.r2);
            check('one point per tip, none for the ancestors', circles('aptx-clock-tips').length === 5 && circles('aptx-clock-internal').length === 0,
                circles('aptx-clock-tips').length + ' + ' + circles('aptx-clock-internal').length);
            const choices = [...dlg.querySelectorAll('.aptx-clock-options label')];
            check('Regression line is offered, Internal nodes is not: no ancestor is dated',
                choices.length === 2 && shown(choices[0]) && !shown(choices[1]) && /Regression/.test(choices[0].textContent) && /Internal/.test(choices[1].textContent),
                choices.map((c) => c.textContent + ':' + (shown(c) ? 'shown' : 'hidden')).join(' '));
            check('Rate is the slope, per year, in no divergence unit (the file states none)', row('Rate') === sig3(fit.slope) + ' per year', row('Rate'));
            check('R²', row('R²') === sig3(fit.r2), row('R²'));
            check('Root date, by the line: where it reaches the root\'s divergence, 0',
                row('Root date, by the line') === String(Math.round((-fit.intercept / fit.slope) * 100) / 100), row('Root date, by the line'));
            check('Root date, in the tree: none, the tree dates no ancestor', /^none/.test(row('Root date, in the tree') || ''), row('Root date, in the tree'));
            check('Tips', row('Tips') === '5', row('Tips'));
            const laid = dlg._aptxClockPlot;
            check('the panel knows the kind, and drew a calendar axis', laid.data.kind === 'root-to-tip' && laid.calendar === true, laid.data.kind + ' ' + laid.calendar);
            const titles = [...dlg.querySelectorAll('text.aptx-clock-title')].map((t) => t.textContent);
            check('the axes: Date, and Divergence with no unit', titles.includes('Date') && titles.includes('Divergence'), titles.join(' | '));
            const noteText = dlg.querySelector('.aptx-clock-note').textContent;
            check('the note says where the divergence comes from, and that only the tips are dated',
                /distance from the root/.test(noteText) && /only the tips are dated/.test(noteText), noteText.slice(0, 80));
            // where the points sit: the scale recovered from A and E (dates) and A
            // and D (divergence), every other tip where it predicts
            const laidTips = laid.data.points.filter((p) => p.tip);
            const pos = new Map();
            circles('aptx-clock-tips').forEach((c, i) => pos.set(laidTips[i].node.name, centre(c)));
            const lin = (a, b, k) => { const va = want.get(a)[k], vb = want.get(b)[k], pa = pos.get(a)[k], pb = pos.get(b)[k];
                return (val) => pa + (val - va) * (pb - pa) / (vb - va); };
            const X = lin('A', 'E', 0), Y = lin('A', 'D', 1);
            let worst = 0;
            want.forEach((val, n) => { worst = Math.max(worst, Math.abs(pos.get(n)[0] - X(val[0])), Math.abs(pos.get(n)[1] - Y(val[1]))); });
            check('every tip sits at its date and its path from the root, on one linear scale', worst < 0.01, 'worst ' + worst.toFixed(4) + ' px');
            check('later is to the right, more divergence is up', pos.get('E')[0] > pos.get('A')[0] && pos.get('D')[1] < pos.get('A')[1]);
            // the link: a click on D's point selects D in the tree
            const pD = pos.get('D');

        check('a click on a point selects its node in the tree', selected().join() === target, selected().join());
        // the selection redraws the tree, which puts the glow out: the pointer
        // has not moved, so it has to come back (code review, 2026-10-02)
        const g2 = glowAt();
        check('...and its node is still lit, the pointer not having moved', !!g2 && Math.abs(g2[0] - node.y) < 0.5 && Math.abs(g2[1] - node.x) < 0.5
            && ring.style.display !== 'none', g2 ? g2.map((v) => v.toFixed(1)).join(',') : 'no glow');
        // ...and that redraw changed nothing the plot shows, so nothing is
        // worked out or laid down again: only the colours are gone over
        check('...and the plot was not laid down again for it', typeof laysBefore === 'number' && dialog()._aptxClockPlot.lays === laysBefore,
            laysBefore + ' -> ' + dialog()._aptxClockPlot.lays);
        check('...the point wears the highlight', hitMarks().length === 1 && Math.abs(centre(hitMarks()[0])[0] - tp[0]) < 0.01,
            hitMarks().length + ' highlighted');
        check('...and Deselect all is enabled', !deselect.disabled);
        pointer('pointerdown', tp[0], tp[1]); pointer('pointerup', tp[0], tp[1]); await sleep(500);
        check('a second click deselects it', selected().length === 0 && hitMarks().length === 0, selected().join());

        // ---- a drag selects the tips in the box. Four boxes, each bounded by ONE
        // of its sides and running off the drawing on the other three, so each
        // side is what decides: the later half and the earlier half by the
        // file's dates, the more and the less diverged half by its divergences
        const sb = svgEl().getBoundingClientRect();
        const band = dlg.querySelector('rect.aptx-clock-box');
        // a cut BETWEEN two values (several tips share a divergence): the gap
        // nearest the middle of the sorted tips
        const mid = (sorted, k) => { const v = (i) => want.get(sorted[i])[k]; const h = Math.floor(sorted.length / 2);
            for (let off = 0; off < h; ++off) { for (const i of [h + off, h - off]) { if (i > 0 && i < sorted.length && v(i) > v(i - 1)) { return (v(i - 1) + v(i)) / 2; } } }
            return NaN; };
        const cutDate = mid(byDate, 0), cutDiv = mid(byDiv, 1);
        check('fixture: each cut falls between two values, no tip on it', isFinite(cutDate) && isFinite(cutDiv)
            && names.every((n) => want.get(n)[0] !== cutDate && want.get(n)[1] !== cutDiv), cutDate + ', ' + cutDiv);
        const boxes4 = [
            {what: 'the later half (the box\'s left side decides)', from: [X(cutDate), 1], to: [sb.width - 1, sb.height - 1], keep: (n) => want.get(n)[0] > cutDate},
            {what: 'the earlier half (its right side)', from: [1, 1], to: [X(cutDate), sb.height - 1], keep: (n) => want.get(n)[0] < cutDate},
            {what: 'the more diverged half (its bottom)', from: [1, 1], to: [sb.width - 1, Y(cutDiv)], keep: (n) => want.get(n)[1] > cutDiv},
            {what: 'the less diverged half (its top)', from: [1, Y(cutDiv)], to: [sb.width - 1, sb.height - 1], keep: (n) => want.get(n)[1] < cutDiv}
        ];
        for (let b = 0; b < boxes4.length; ++b) {
            const bx = boxes4[b];
            const inBox = names.filter(bx.keep).sort();
            pointer('pointerdown', bx.from[0], bx.from[1]);
            pointer('pointermove', (bx.from[0] + bx.to[0]) / 2, (bx.from[1] + bx.to[1]) / 2);
            if (b === 0) {
                check('a drag draws its box', band.style.display !== 'none' && parseFloat(band.getAttribute('width')) > 15);
            }
            pointer('pointermove', bx.to[0], bx.to[1]); pointer('pointerup', bx.to[0], bx.to[1]); await sleep(600);
            check('a drag selects exactly the tips in the box: ' + bx.what, inBox.length > 0 && inBox.length < names.length
                && selected().join('|') === inBox.join('|'), selected().length + ' selected, ' + inBox.length + ' of ' + names.length + ' in the box');
            if (b === 0) {
                check('...no internal node with them', archaeopteryx.getSelectedNodes().every((n) => !n.children));
                check('...each wearing the highlight', hitMarks().length === inBox.length, hitMarks().length);
                check('...and the box is gone', band.style.display === 'none');
            }
            deselect.click(); await sleep(500);
            check('Deselect all: nothing selected, no highlight, the button disabled again', selected().length === 0 && hitMarks().length === 0 && deselect.disabled);
        }

        // ---- the view of a clade: the clade's points, the clade's line
        const all = []; forester.preOrderTraversalAll(forester.getTreeRoot(tree), (n) => all.push(n));
        const clade = all.filter((n) => n.children && n.parent && n.parent.parent && n.parent.parent.parent)
            .map((n) => ({n, tips: forester.getAllExternalNodes(n)}))
            .filter((c) => c.tips.length >= 4 && c.tips.length < want.size && new Set(c.tips.map((t) => want.get(t.name)[0])).size > 1)
            .sort((a, b) => b.tips.length - a.tips.length)[0];
        check('fixture: a clade of four tips or more, not all on one date', !!clade, clade ? clade.tips.length + ' tips' : 'none');
        if (clade) {
            const cfit = ols(clade.tips.map((t) => want.get(t.name)));
            let inner = 0; forester.preOrderTraversalAll(clade.n, (n) => { if (n.children) { ++inner; } });
            const laysWhole = dialog()._aptxClockPlot.lays;
            viewer.applyViewState({subtree: clade.n.viewId}); await sleep(1800);
            check('in the view of a clade the panel stays open', !!dialog() && dialog().open);
            check('...and is laid down again, for the clade', dialog()._aptxClockPlot.lays > laysWhole, laysWhole + ' -> ' + dialog()._aptxClockPlot.lays);
            check('...with the clade\'s points only', tipMarks().length === clade.tips.length && circles('aptx-clock-internal').length === inner,
                tipMarks().length + ' + ' + circles('aptx-clock-internal').length + ' of ' + clade.tips.length + ' + ' + inner);
            check('...and the clade\'s own line', row('Rate') === sig3(cfit.slope) + ' subs/site per year' && row('R²') === sig3(cfit.r2),
                row('Rate') + ', R2 ' + row('R²') + ' vs ' + sig3(cfit.slope) + ', ' + sig3(cfit.r2));
            check('...and Tips says it is the clade', row('Tips') === clade.tips.length + ' (the clade on view)', row('Tips'));
            check('fixture: the clade\'s line is not the tree\'s', sig3(cfit.slope) !== sig3(fit.slope) || sig3(cfit.r2) !== sig3(fit.r2));
            viewer.applyViewState({subtree: null}); await sleep(1800);
            check('back on the whole tree: the tree\'s points and line', tipMarks().length === want.size && row('Rate') === sig3(fit.slope) + ' subs/site per year',
                tipMarks().length + ', ' + row('Rate'));
        }

        // ---- a collapsed clade: its tips keep their points, and one of them
        // pointed at lights the clade, which is what the tree shows of it
        if (clade) {
            viewer.applyViewState({collapsed: [clade.n.viewId]}); await sleep(1500);
            check('fixture: the clade is collapsed', clade.n.collapsed === true);
            check('a collapsed clade\'s tips keep their points', tipMarks().length === want.size, tipMarks().length);
            const inside = pos.get(clade.tips[0].name);
            pointer('pointermove', inside[0], inside[1]); await sleep(200);
            const gc = glowAt();
            check('pointing at one of them lights the collapsed clade', !!gc && Math.abs(gc[0] - clade.n.y) < 0.5 && Math.abs(gc[1] - clade.n.x) < 0.5,
                gc ? gc.map((v) => v.toFixed(1)).join(',') + ' vs clade ' + clade.n.y.toFixed(1) + ',' + clade.n.x.toFixed(1) : 'no glow');
            pointer('pointermove', 2, 2);
            viewer.applyViewState({collapsed: []}); await sleep(1500);
        }

        // ---- Time | Div leaves the plot alone: it draws both
        const before = tipMarks().map((c) => centre(c).join()).join(' ');
        byId('branch_scale_div_b').click(); await sleep(1500);
        check('the tree in Div: the same points, the same line', tipMarks().map((c) => centre(c).join()).join(' ') === before
            && row('Rate') === sig3(fit.slope) + ' subs/site per year');
        byId('branch_scale_time_b').click(); await sleep(1500);

        // ---- the theme, and the close control
        const themeBtn = document.querySelector('#p .aptx-theme-btn');
        if (themeBtn) {
            const wasDark = dialog().classList.contains('aptx-dark');
            themeBtn.click(); await sleep(200);
            check('the open panel turns with the theme', dialog().classList.contains('aptx-dark') !== wasDark
                && (dialog().classList.contains('aptx-dark') || dialog().classList.contains('aptx-light')));
            themeBtn.click(); await sleep(200);
        } else {
            check('a theme switch to press', false);
        }
        if (/[?&]hold=1/.test(location.search)) { finish(); return; }   // for a screenshot
        // Nothing below waits: a dialog's `close` event comes in a later task
        // (much later in a throttled tab), and a viewer that waited for it
        // swallowed the next press of the button.
        dialog().querySelector('.aptx-dialog-close').click();
        check('the close control closes it at once, and the button goes dark', !dialog() && !byId('clock_plot_b').classList.contains('aptx-lit'));
        byId('clock_plot_b').click();
        check('the button opens it again, at once', !!dialog() && dialog().open && byId('clock_plot_b').classList.contains('aptx-lit'));
        byId('clock_plot_b').click();
        check('...and pressed again, closes it at once', !dialog() && !byId('clock_plot_b').classList.contains('aptx-lit'));
        byId('clock_plot_b').click();
        check('...and a third press opens it again: no press is swallowed', !!dialog() && dialog().open);
        check('...with Internal nodes as it was left: the choice is kept while the page lives',
            dialog().querySelectorAll('.aptx-clock-options input[type=checkbox]')[1].checked && circles('aptx-clock-internal').length === internalCount);
        await sleep(300);
        check('...and it is still open once the old panel\'s close event has come', !!dialog() && dialog().open
            && document.querySelectorAll('#aptx_clock_plot').length === 1);
        byId('clock_plot_b').click();
    } catch (e) {
        failures++;
        out.push('FAIL  the harness threw: ' + (e && e.stack ? e.stack : e));
    }
    finish();
}());
</script>
